<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>一条线 · 60s</title>
<style>html,body{margin:0;background:#05050F;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   《一条线》60 秒
   原则：整体节奏放慢，但**每个镜头里有 3–4 拍**，每一拍都有文案配合。
   全片只有一个对象：一条线。它依次是 心跳 → 横轴 → 天平 → 心 → 一个点。
   20 句文案，平均 3 秒一句（比 30 秒版密）。
   ===================================================================== */
const W=1920,H=1080; window.DUR=60;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const C={white:'#EAEAF2',gray:'#8A8AA0',dim:'#556',gold:'#C9A96A',gold2:'#E8C88A',red:'#C2452E'};
const FS='"Microsoft YaHei","PingFang SC",sans-serif';
const FT='"Noto Serif SC","Songti SC",SimSun,serif';
const FL='Georgia,"Times New Roman",serif';
const FM='Consolas,"Cascadia Mono",monospace';

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const stars=(()=>{const r=mulberry32(5),p=[];for(let i=0;i<180;i++)p.push({x:r()*W,y:r()*H,r:.4+r()*1.5,ph:r()*6.28,sp:.4+r()*.9});return p;})();
const grain=(()=>{const r=mulberry32(3),p=[];for(let i=0;i<700;i++)p.push({x:r()*W,y:r()*H,a:.01+r()*.028,s:1+r()*1.5});return p;})();
const R=(()=>{const r=mulberry32(21);const a=[];for(let i=0;i<600;i++)a.push(r());return a;})();

function text(str,x,y,{font=`400 40px ${FS}`,color=C.white,align='center',alpha=1,shadow=0,sc='rgba(0,0,0,.85)'}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;
  if(shadow>0){ctx.shadowBlur=shadow;ctx.shadowColor=sc;}
  ctx.fillText(str,x,y);ctx.restore();
}
function tracked(str,x,y,tr,{font=`500 21px ${FS}`,color=C.gold,align='center',alpha=1}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.fillStyle=color;
  const ch=[...str],w=ch.map(c=>ctx.measureText(c).width);
  const tot=w.reduce((a,b)=>a+b,0)+tr*Math.max(0,ch.length-1);
  let cx=align==='center'?x-tot/2:align==='right'?x-tot:x;
  ch.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=w[i]+tr;});ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------------- 路径（全部 360 点） ---------------- */
const N=360;
const P_ECG=[], P_AXIS=[], P_BEAM=[], P_HEART=[];
function ecgY(u){
  const ph=(u*2.4)%1; let y=0;
  if(ph<0.10) y=.06*Math.sin(ph/.10*Math.PI);
  else if(ph<0.15) y=0;
  else if(ph<0.18) y=-.20*Math.sin((ph-.15)/.03*Math.PI/2);
  else if(ph<0.24) y=1.0*Math.sin((ph-.18)/.06*Math.PI)-.20;
  else if(ph<0.31) y=-.38*Math.sin((ph-.24)/.07*Math.PI);
  else if(ph<0.44) y=.13*Math.sin((ph-.31)/.13*Math.PI);
  return -y*.55;
}
for(let i=0;i<=N;i++){
  const u=i/N;
  P_ECG.push({x:lerp(-1,1,u), y:ecgY(u)});
  P_AXIS.push({x:lerp(-1,1,u), y:0});
  P_BEAM.push({x:lerp(-.72,.72,u), y:0});
  const a=u*Math.PI*2;
  const hx=16*Math.pow(Math.sin(a),3), hy=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);
  P_HEART.push({x:hx/17*.92, y:-hy/17*.92});
}
function rate(x){ const d=(x-.37)/.25; return Math.exp(-d*d)*.36; }

/* ---------------- 线渲染（2.5D） ---------------- */
const SX=W*.30, SY=H*.27;
function drawLine(pts,{alpha=1,thick=3.6,glow=34,depth=16,c1='#FFB3C8',c2='#FF5C86',c3='#C32B54',squash=1,scale=1,rot=0,oy=0}={}){
  if(pts.length<2||alpha<=0.01) return;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.translate(W*.5, H*.44+oy); ctx.rotate(rot); ctx.scale(scale*squash, scale);
  for(let L=6;L>=1;L--){
    const k=L/6, dx=-k*depth*.62, dy=k*depth;
    ctx.beginPath();
    pts.forEach((p,i)=>{ const x=p.x*SX+dx, y=p.y*SY+dy; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.strokeStyle=`rgba(${Math.round(110+40*(1-k))},${Math.round(20+16*(1-k))},${Math.round(44+18*(1-k))},${.5*(1-k)+.18})`;
    ctx.lineWidth=thick; ctx.lineJoin='round'; ctx.stroke();
  }
  const lg=ctx.createLinearGradient(0,-SY,0,SY);
  lg.addColorStop(0,c1); lg.addColorStop(.45,c2); lg.addColorStop(1,c3);
  ctx.beginPath();
  pts.forEach((p,i)=>{ const x=p.x*SX, y=p.y*SY; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.shadowBlur=glow; ctx.shadowColor='rgba(255,90,130,.8)';
  ctx.strokeStyle=lg; ctx.lineWidth=thick; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  ctx.beginPath();
  pts.forEach((p,i)=>{ const x=p.x*SX-2, y=p.y*SY-2.6; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(255,240,246,.6)'; ctx.lineWidth=thick*.28; ctx.stroke();
  ctx.restore();
}

/* ---------------- 背景（同族色，缓慢变化） ---------------- */
function backdrop(t){
  const u=t/window.DUR;
  const hue=lerp(232,340,easeInOut(clamp(u,0,1)));
  const g=ctx.createRadialGradient(W*.5,H*.42,60,W*.5,H*.5,W*.88);
  g.addColorStop(0,`hsl(${hue},44%,10%)`);
  g.addColorStop(.6,`hsl(${hue},42%,5%)`);
  g.addColorStop(1,'#040308');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.globalAlpha=.10+.22*(.5+.5*Math.sin(t*2.4*s.sp+s.ph));
    ctx.fillStyle='#E6E0F0'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  const sx=lerp(-400,W+400,((t/16)%1));
  const lg=ctx.createLinearGradient(sx-320,0,sx+320,H);
  lg.addColorStop(0,'rgba(255,240,220,0)'); lg.addColorStop(.5,'rgba(255,240,220,.06)'); lg.addColorStop(1,'rgba(255,240,220,0)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
  for(const p of grain){ ctx.globalAlpha=p.a; ctx.fillStyle='#fff'; ctx.fillRect(p.x,p.y,p.s,p.s); }
  ctx.globalAlpha=1;
}

/* ---------------- 强调数字（固定位置） ---------------- */
const NPOS={x:W*.5,y:H*.715};
const NUMS=[
  {t0:9.2,  t1:12.2, val:'2.7%',  lab:'遇见一个人的概率'},
  {t0:20.8, t1:24.0, val:'37%',   lab:'先看，再出手'},
  {t0:30.2, t1:33.2, val:'5 : 1', lab:'善意 : 伤害'}
];
function emphasis(t){
  for(const n of NUMS){
    const a=Math.min(seg(t,n.t0,n.t0+.25),1-seg(t,n.t1-.3,n.t1));
    if(a<=0.01) continue;
    const u=seg(t,n.t0,n.t0+.36);
    const pk=1+.16*Math.sin(Math.PI*u)*Math.pow(1-u,.4);
    ctx.save(); ctx.globalAlpha=a;
    ctx.translate(NPOS.x,NPOS.y); ctx.scale(pk,pk); ctx.translate(-NPOS.x,-NPOS.y);
    text(n.val,NPOS.x,NPOS.y,{font:`400 132px ${FM}`,color:'#F5E4BE',shadow:54,sc:'rgba(201,169,106,.6)'});
    ctx.restore();
    text(n.lab,NPOS.x,NPOS.y+46,{font:`400 27px ${FS}`,color:C.gray,alpha:a});
  }
  // 章节切换的短白闪
  let fl=0;
  for(const c of [12,24,36,48]) fl=Math.max(fl,1-Math.abs(t-c)/0.09);
  if(fl>0.01){ ctx.save(); ctx.globalAlpha=clamp(fl,0,1)*.30; ctx.fillStyle='#FFF6E2'; ctx.fillRect(0,0,W,H); ctx.restore(); }
}

/* ---------------- 文案（20 句，平均 3 秒一句） ---------------- */
const SUBS=[
  [0.6, 3.4,'先看一条线','Watch this one line'],
  [3.4, 6.2,'它是一次心跳','It is a heartbeat'],
  [6.2, 9.2,'一生大约三十亿次','About three billion in a lifetime'],
  [9.4,12.2,'但真正改变你的，只有几次','But only a few change you'],

  [12.6,15.4,'把它拉直，就是一条轴','Straighten it: an axis'],
  [15.4,18.0,'横轴是时间，纵轴是成功','Time across, success up'],
  [18.0,20.8,'数学家让它跑了一千次','A thousand trials'],
  [20.8,24.0,'答案是 37%：先看，再出手','37%: look, then leap'],

  [24.4,27.2,'再压平，它是一架天平','Flatten it: a balance'],
  [27.2,30.0,'左边放善意，右边放伤害','Kindness left, harm right'],
  [30.0,33.2,'稳定关系的比例是 5 : 1','Stable couples run 5:1'],
  [33.2,36.0,'掉到 1 : 1，多半走不到最后','At 1:1, most do not last'],

  [36.4,39.2,'现在把它收起来','Now gather it'],
  [39.2,42.0,'两端往里弯','Bend both ends inward'],
  [42.0,45.0,'它回到最初的样子','It returns to its first shape'],
  [45.0,48.0,'一条线，一颗心','One line, one heart'],

  [48.4,51.2,'所以我们算得出概率','So we can compute odds'],
  [51.2,54.0,'算得出比例','We can compute ratios'],
  [54.0,56.8,'但算不出，你什么时候会心动','But not when your heart will move'],
  [56.8,59.4,'那一下，永远是例外','That beat is always the exception']
];
function subs(t){
  for(const [a,b,zh,en] of SUBS){
    const al=Math.min(seg(t,a,a+.28),1-seg(t,b-.22,b));
    if(al<=0.01) continue;
    text(zh,W/2,H*.885,{font:`700 46px ${FS}`,alpha:al,shadow:26});
    text(en,W/2,H*.885+44,{font:`italic 400 26px ${FL}`,color:'#9C9CB4',alpha:al*.95});
  }
}

/* ---------------- 主渲染 ---------------- */
window.render=function(t){
  const T=clamp(t,0,window.DUR);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  backdrop(T);

  /* 主线状态：心跳 → 横轴 → 横梁 → 心 → 点 */
  const drawP=easeOut(seg(T,0.4,3.2));
  const mAxis=easeInOut(seg(T,12.2,14.6));
  const mHeart=easeInOut(seg(T,39.0,45.0));
  const mDot=easeInOut(seg(T,48.2,51.0));
  const beat=Math.max(
    Math.sin(Math.PI*clamp(seg(T,4.2,4.7),0,1)),
    Math.sin(Math.PI*clamp(seg(T,45.4,45.9),0,1)),
    Math.sin(Math.PI*clamp(seg(T,46.6,47.1),0,1))*0.8
  );
  const turn=easeInOut(seg(T,45.0,48.0));

  const nMain=Math.max(2,Math.floor(N*(T<3.2?drawP:1)));
  const main=[];
  for(let i=0;i<nMain;i++){
    const e=P_ECG[i], ax=P_BEAM[i], h=P_HEART[i];
    const x1=lerp(e.x,ax.x,mAxis), y1=lerp(e.y,ax.y,mAxis);
    const x2=lerp(x1,h.x,mHeart), y2=lerp(y1,h.y,mHeart);
    // 最后收成一个点
    main.push({x:lerp(x2,0,mDot), y:lerp(y2,0,mDot)});
  }
  const squash=1-0.13*Math.sin(Math.PI*turn);
  // 天平失衡时，横梁本身跟着倾（不是只挪托盘）
  const tiltBeam=easeInOut(seg(T,33.2,35.4))*0.055;
  drawLine(main,{alpha:1,thick:3.6,glow:34+80*beat,depth:16+10*mHeart,squash,
    scale:1+0.06*beat,rot:-0.05*Math.sin(Math.PI*turn)+tiltBeam});

  /* 第 2 拍：横轴上出现刻度（15.4–18），进入天平前收起 */
  const tickA=easeOut(seg(T,15.4,17.0))*(1-seg(T,23.6,24.6));
  if(tickA>0.01){
    ctx.save(); ctx.globalAlpha=tickA*.8;
    const y=H*.44;
    for(let i=0;i<=4;i++){
      const x=W*.5-SX+ i*(SX*2/4);
      ctx.strokeStyle='rgba(232,200,138,.55)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(x,y-8); ctx.lineTo(x,y+8); ctx.stroke();
    }
    ctx.restore();
    text('0',W*.5-SX,y+40,{font:`400 20px ${FM}`,color:C.dim,alpha:tickA});
    text('100%',W*.5+SX,y+40,{font:`400 20px ${FM}`,color:C.dim,alpha:tickA});
  }

  /* 第 3 拍：曲线（18–21 长出，24–27 压平） */
  const cIn=easeInOut(seg(T,18.0,20.6)), cFlat=easeInOut(seg(T,24.0,26.6));
  if(cIn>0.01&&cFlat<0.99){
    const pts=[]; const n=Math.floor(N*cIn);
    for(let i=0;i<n;i++){
      const u=i/N, x=lerp(-1,1,u);
      pts.push({x, y:lerp(-rate(u)*1.6,0,cFlat)});
    }
    drawLine(pts,{alpha:(1-cFlat)*.95,thick:2.6,glow:26,depth:10,
      c1:'#FFF0D0',c2:'#E8C88A',c3:'#C9A96A'});
  }

  /* 第 3 拍：托盘（27–33 垂下；33–36 失衡） */
  const panA=Math.min(seg(T,26.8,28.2),1-seg(T,35.6,36.4));
  if(panA>0.01){
    const cx=W*.5, cy=H*.44;
    const tilt=easeInOut(seg(T,33.2,35.4));             // 0→1 倾斜
    [-1,1].forEach((sgn,i)=>{
      const bx=cx+sgn*.72*SX;
      const base=(i===0?140:30);
      const grow=i===0?1:(1+tilt*2.4);                  // 右侧伤害快速变长
      const hgt=base*grow*(0.6+0.4*easeOut(seg(T,27.0,29.2)));
      const dy=i===0? tilt*18 : -tilt*18;               // 天平倾斜
      ctx.save(); ctx.globalAlpha=panA*.9;
      ctx.strokeStyle='rgba(232,200,138,.55)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(bx,cy+dy); ctx.lineTo(bx,cy+dy+32); ctx.stroke();
      // 托盘：一条细横托，让"重物"看起来是放在盘上的
      ctx.strokeStyle='rgba(232,200,138,.75)'; ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.moveTo(bx-58,cy+dy+32); ctx.lineTo(bx+58,cy+dy+32); ctx.stroke();
      ctx.fillStyle=i===0?'rgba(232,200,138,.85)':'rgba(194,69,46,.82)';
      ctx.fillRect(bx-46,cy+dy+34,92,hgt);
      ctx.restore();
      text(i===0?'善意':'伤害',bx,cy+dy+32+hgt+28,{font:`400 22px ${FS}`,color:C.gray,alpha:panA*.9});
    });
  }

  /* 第 4 拍：心旁边的小字（45–48） */
  const hA=easeOut(seg(T,45.2,46.4))*(1-seg(T,47.8,48.2));
  if(hA>0.01){
    text('每一次心跳，约 0.8 秒',W*.5,H*.44+SY*.92+70,{font:`400 26px ${FS}`,color:'#CFBFD0',alpha:hA});
  }

  /* 暗角（先画，压在图形上、文字下） */
  const v=ctx.createRadialGradient(W/2,H/2,H*.34,W/2,H/2,H*1.04);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.62)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  /* 文字层（永远在暗角之上） */
  emphasis(T);
  subs(T);

  /* 顶栏 */
  const ha=easeOut(seg(T,0.3,1.2))*(1-seg(T,59.2,59.8));
  tracked('@YOURNAME',84,74,3,{align:'left',alpha:.7*ha,color:C.gray,font:`500 21px ${FS}`});
  tracked('一条线 · 60 秒',W/2,74,2.6,{alpha:.85*ha});
  const f=Math.floor((T%1)*30),s=Math.floor(T)%60,m=Math.floor(T/60);
  text(`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`,W-84,74,
    {font:`400 21px ${FM}`,color:C.dim,align:'right',alpha:.8*ha});

  /* 结尾卡 */
  const ea=easeOut(seg(T,56.8,57.6));
  if(ea>0.01){
    text('《一条线》',W/2,H*.30,{font:`900 74px ${FT}`,color:C.gold2,alpha:ea,shadow:40,sc:'rgba(201,169,106,.4)'});
  }

  const fo=seg(T,59.2,60);
  if(fo>0){ ctx.save(); ctx.globalAlpha=fo; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.restore(); }
};
window.READY=false;
(async()=>{ try{ await document.fonts.ready; }catch(e){}
  window.READY=true;
  const q=new URLSearchParams(location.search);
  if(q.has('t')){ window.render(parseFloat(q.get('t'))); return; }
  const t0=performance.now();
  const loop=()=>{ window.render(((performance.now()-t0)/1000)%window.DUR); requestAnimationFrame(loop); };
  loop();
})();
</script>
</body></html>
