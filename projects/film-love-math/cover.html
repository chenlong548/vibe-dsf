<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>片头 · 爱情的三个数学事实</title>
<style>html,body{margin:0;background:#0B0703;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   片头 4 秒（独立文件，渲染后与正片拼接）
   四拍：碎片飞入 → 组装成框 → 闪光横扫 → 标题逐字
   依据：awesome-opus5-5-videos 里 3D Logo Intro 的结构
        "pieces fly in, assemble, rotate, a flash passes, name appears letter by letter"
   机位固定（与正片同一规则）
   ===================================================================== */
const W=1920,H=1080; window.DUR=4;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const FS='"Microsoft YaHei","PingFang SC",sans-serif';
const FT='"Noto Serif SC","Songti SC",SimSun,serif';
const FM='Consolas,"Cascadia Mono",monospace';

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=(()=>{const r=mulberry32(7);const a=[];for(let i=0;i<80;i++)a.push(r());return a;})();
const stars=(()=>{const r=mulberry32(11),p=[];for(let i=0;i<150;i++)p.push({x:r()*W,y:r()*H,r:.5+r()*1.6,ph:r()*6.28,sp:.4+r()*.8});return p;})();

function text(str,x,y,{font=`400 40px ${FS}`,color='#EFE6D0',align='left',alpha=1,shadow=0,sc='rgba(224,184,122,.55)'}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;
  if(shadow>0){ctx.shadowBlur=shadow;ctx.shadowColor=sc;}
  ctx.fillText(str,x,y);ctx.restore();
}
function tracked(str,x,y,tr,{font=`500 22px ${FS}`,color='#E0B87A',align='center',alpha=1}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.fillStyle=color;
  const ch=[...str],w=ch.map(c=>ctx.measureText(c).width);
  const tot=w.reduce((a,b)=>a+b,0)+tr*Math.max(0,ch.length-1);
  let cx=align==='center'?x-tot/2:align==='right'?x-tot:x;
  ch.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=w[i]+tr;});ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* 边框目标位置：1400×420 的框，四边各 3 段碎片（共 12 片） */
const FX=W*.5, FY=H*.44, FW=1400, FH=400;
const FRAG=(()=>{
  const out=[];
  const per=3;
  // 上下边（用中心坐标，和竖条保持一致）
  for(let s=0;s<2;s++) for(let i=0;i<per;i++){
    const len=FW/per;
    out.push({tx:FX-FW/2+len*i+len/2, ty:FY+(s?FH/2:-FH/2), w:len-10, h:6, rot:0});
  }
  // 左右边
  for(let s=0;s<2;s++) for(let i=0;i<per;i++){
    const len=FH/per;
    out.push({tx:FX+(s?FW/2:-FW/2), ty:FY-FH/2+len*i+len/2, w:6, h:len-10, rot:0});
  }
  return out;
})();

window.render=function(t){
  // 底色：金黑（与正片"落点"章衔接）
  const g=ctx.createRadialGradient(W*.5,H*.44,40,W*.5,H*.5,W*.86);
  g.addColorStop(0,'#1A1108'); g.addColorStop(.55,'#0D0804'); g.addColorStop(1,'#070403');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 星点
  for(const s of stars){
    ctx.globalAlpha=.10+.22*(.5+.5*Math.sin(t*4*s.sp+s.ph));
    ctx.fillStyle='#E8DCC4'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  // 光晕
  const halo=.10+.05*Math.sin(t*3.2);
  const hg=ctx.createRadialGradient(W*.5,H*.44,40,W*.5,H*.44,720);
  hg.addColorStop(0,`rgba(240,210,150,${halo})`); hg.addColorStop(1,'rgba(240,210,150,0)');
  ctx.fillStyle=hg; ctx.fillRect(0,0,W,H);

  /* ---- 拍 1–2：碎片飞入 + 组装（0–1.9s）---- */
  const asm=easeInOut(seg(t,1.05,1.90));
  FRAG.forEach((f,i)=>{
    const ap=easeOutBack(seg(t,0.02+i*0.045,0.72+i*0.045));
    if(ap<=0.001) return;
    // 起点：从画面外同侧飞入
    const dirX=f.tx<W/2?-1:1, dirY=f.ty<H/2?-1:1;
    const sx=f.tx+dirX*(620+R[i]*380), sy=f.ty+dirY*(420+R[i+12]*320);
    const x=lerp(sx,f.tx,asm>0?1:ap), y=lerp(sy,f.ty,asm>0?1:ap);
    const px=asm>0?f.tx:lerp(sx,f.tx,ap), py=asm>0?f.ty:lerp(sy,f.ty,ap);
    ctx.save();
    ctx.globalAlpha=clamp(ap,0,1)*.95;
    ctx.translate(px,py);
    ctx.rotate((1-clamp(ap,0,1))*0.5*(R[i+30]-0.5)*2);
    ctx.shadowBlur=18; ctx.shadowColor='rgba(232,200,138,.65)';
    ctx.fillStyle='#E8C88A';
    rr(-f.w/2,-f.h/2,f.w,f.h,3); ctx.fill();
    ctx.restore();
  });
  // 组装后的整体过冲
  const pop=easeOutBack(seg(t,1.72,2.02));

  /* ---- 拍 3：闪光横扫（1.9–2.55s）---- */
  const fl=easeInOut(seg(t,1.95,2.50));
  if(fl>0.001&&fl<0.999){
    const sx=lerp(-300,W+300,fl);
    const lg=ctx.createLinearGradient(sx-190,0,sx+190,H);
    lg.addColorStop(0,'rgba(255,250,235,0)');
    lg.addColorStop(.5,'rgba(255,250,235,.55)');
    lg.addColorStop(1,'rgba(255,250,235,0)');
    ctx.save(); ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  /* ---- 拍 4：标题逐字（2.45–4.0s）---- */
  const TITLE='爱情的三个数学事实';
  const chars=[...TITLE];
  ctx.save();
  ctx.font=`900 104px ${FT}`;
  const widths=chars.map(c=>ctx.measureText(c).width);
  const tot=widths.reduce((a,b)=>a+b,0)+6*(chars.length-1);
  let cx=W/2-tot/2;
  const baseY=H*.44+36;
  const pk=1+0.09*Math.sin(Math.PI*clamp(seg(t,3.55,3.95),0,1)*(1-clamp(seg(t,3.55,3.95),0,1))*4);
  chars.forEach((ch,i)=>{
    const ap=easeOut(seg(t,2.45+i*0.055,2.85+i*0.055));
    if(ap>0.001){
      ctx.save();
      ctx.globalAlpha=clamp(ap,0,1);
      ctx.font=`900 104px ${FT}`;
      ctx.fillStyle='#F0D9A8';
      ctx.shadowBlur=46; ctx.shadowColor='rgba(224,184,122,.55)';
      const yy=baseY+(1-clamp(ap,0,1))*26;
      ctx.fillText(ch,cx, yy);
      ctx.restore();
    }
    cx+=widths[i]+6;
  });
  ctx.restore();

  // 副标 + 标签
  const sa=easeOut(seg(t,3.05,3.45));
  tracked('三 个 数 字 ， 一 个 结 论',W/2,baseY+118,4,{alpha:sa*.9,font:`500 26px ${FS}`});
  const ba=easeOut(seg(t,3.30,3.70));
  text('1080p · 3 分钟 · 全片由代码渲染',W/2,H*.44+FH/2+92,{font:`400 22px ${FS}`,color:'#8A6A50',align:'center',alpha:ba*.85});

  // 收尾压暗（不淡到全黑）
  const dk=seg(t,3.86,4.0);
  if(dk>0){ ctx.save(); ctx.globalAlpha=dk*.30; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.restore(); }
};
window.READY=false;
(async()=>{ try{ await document.fonts.ready; }catch(e){}
  window.READY=true;
  const q=new URLSearchParams(location.search);
  if(q.has('t')){ window.render(parseFloat(q.get('t'))); return; }
  const t0=performance.now();
  const loop=()=>{ window.render(((performance.now()-t0)/1000)%window.DUR); requestAnimationFrame(loop); };
  loop();
})();
</script>
</body></html>
