<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>B · 按禁令 + 风格 DNA 写</title>
<style>html,body{margin:0;background:#05050F;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ============ B 组：逐条套 F1/F2/F3 + style-dna ============
   F1 对称癖   → 主视觉重心偏左 11%，卡片间距不等
   F2 匀速癖   → 全部 easeOutBack / easeInOut，无线性
   F3 平均分布 → 卡片 y 抖动 ±14px、旋转 ±2.2°，非等距
   DNA         → 星点+颗粒+暗角、五区布局、双语字幕、字距、单一金色
   其他        → 微动效（卡片浮动/星点呼吸）、数字滚动、注释带
*/
const W = 1920, H = 1080;
window.DUR = 6;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const C = { white:'#EAEAF2', gray:'#8A8AA0', dim:'#5A5A72', gold:'#C9A96A', bg1:'#12122A', bg0:'#05050F' };
const FS = '"Microsoft YaHei","PingFang SC",sans-serif';
const FSerif = '"Noto Serif SC","Songti SC",SimSun,Georgia,serif';
const FLatin = 'Georgia,"Times New Roman",serif';
const FMono = 'Consolas,"Cascadia Mono",monospace';

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const stars=(()=>{const r=mulberry32(11),p=[];for(let i=0;i<170;i++)p.push({x:r()*W,y:r()*H,r:.5+r()*1.7,ph:r()*6.28,sp:.25+r()*.5});return p;})();
const grain=(()=>{const r=mulberry32(3),p=[];for(let i=0;i<900;i++)p.push({x:r()*W,y:r()*H,a:.012+r()*.03,s:1+r()*1.6});return p;})();

function tracked(str,x,y,tr,{font=`500 21px ${FS}`,color=C.gold,align='left',alpha=1}={}){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=font; ctx.fillStyle=color; ctx.textBaseline='alphabetic';
  const ch=[...str], w=ch.map(c=>ctx.measureText(c).width);
  const total=w.reduce((a,b)=>a+b,0)+tr*Math.max(0,ch.length-1);
  let cx=align==='center'?x-total/2:align==='right'?x-total:x;
  ch.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=w[i]+tr;});
  ctx.restore();
}
function text(str,x,y,{font=`400 30px ${FS}`,color=C.white,align='left',alpha=1,shadow=0,sc='rgba(201,169,106,.5)'}={}){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=font; ctx.fillStyle=color; ctx.textAlign=align;
  ctx.textBaseline='alphabetic';
  if(shadow>0){ctx.shadowBlur=shadow;ctx.shadowColor=sc;}
  ctx.fillText(str,x,y); ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* 卡片：不等距 + 抖动 + 旋转，第 3 张是"37% 的位置" */
const GAPS = [10, 46, 14, 58, 18, 34, 12];      // 故意不等距
const DYS  = [ 8, -12, 14, -6, 10, -14, 4];     // 故意不齐
const ROTS = [1.8, -2.2, 1.2, -1.6, 2.4, -1.1, 1.5];
const HL = 2;

window.render = function(t){
  // ---- 背景 ----
  const g = ctx.createRadialGradient(W*.5,H*.4,60,W*.5,H*.52,W*.8);
  g.addColorStop(0,C.bg1); g.addColorStop(.55,'#0A0A18'); g.addColorStop(1,C.bg0);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.globalAlpha=.18+.34*(.5+.5*Math.sin(t*s.sp+s.ph));
    ctx.fillStyle='#DFDFF0'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const p of grain){ ctx.globalAlpha=p.a; ctx.fillStyle='#fff'; ctx.fillRect(p.x,p.y,p.s,p.s); }
  ctx.globalAlpha=1;
  const v=ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*1.0);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.62)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // ---- 顶栏 ----
  const hud = easeOut(seg(t,.2,.9));
  tracked('@YOURNAME',84,74,3,{color:C.gray,alpha:.75*hud});
  tracked('决策论 · 秘书问题',W/2,74,2.4,{align:'center',alpha:.9*hud});
  text('00:0'+Math.floor(t)+':'+String(Math.floor((t%1)*30)).padStart(2,'0'),W-84,74,
       {font:`400 21px ${FMono}`,color:C.dim,align:'right',alpha:.85*hud});

  // ---- 标题：左置（偏离中线 11%），衬线金色 ----
  const t1=easeOut(seg(t,.4,1.3));
  tracked('THE 37% RULE',300,300,6,{font:`500 20px ${FS}`,alpha:.85*t1});
  text('《37% 法则》',296,410+(1-t1)*16,{
    font:`900 92px ${FSerif}`,color:C.gold,alpha:t1,shadow:40,sc:'rgba(201,169,106,.35)'});
  const t2=easeOut(seg(t,.9,1.8));
  text('什么时候该停止选择',300,470,{font:`400 34px ${FS}`,color:'#CFCFDE',alpha:t2});
  text('When to stop looking',300,508,{font:`italic 400 24px ${FLatin}`,color:C.gray,alpha:t2*.95});

  // ---- 卡片：交错进场 + 浮动 + 不等距 ----
  const CARD_W=118, CARD_H=158, baseY=596;
  let x = 300;
  const items=[];
  for(let i=0;i<7;i++){ items.push({x, i}); x += CARD_W + GAPS[i]; }
  items.forEach(({x:x0,i})=>{
    const ap = easeOutBack(seg(t, 1.2 + i*0.09, 1.9 + i*0.09));
    if(ap<=0.001) return;
    const floatY = Math.sin(t*0.8 + i*1.7)*2.2;          // 微动效：呼吸浮动
    const y = baseY + DYS[i] + floatY + (1-ap)*26;
    const isHL = i===HL;
    ctx.save();
    ctx.globalAlpha = clamp(ap,0,1);
    ctx.translate(x0+CARD_W/2, y+CARD_H/2);
    ctx.rotate(ROTS[i]*Math.PI/180);
    ctx.translate(-(x0+CARD_W/2), -(y+CARD_H/2));
    if(isHL){ ctx.shadowBlur=34; ctx.shadowColor='rgba(201,169,106,.75)'; }
    rr(x0,y,CARD_W,CARD_H,6);
    ctx.fillStyle = isHL ? 'rgba(201,169,106,.14)' : 'rgba(255,255,255,.045)';
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle = isHL ? C.gold : 'rgba(255,255,255,.14)';
    ctx.lineWidth = isHL ? 2.2 : 1.1;
    ctx.stroke();
    text(String(i+1).padStart(2,'0'), x0+CARD_W/2, y+CARD_H/2+14,
         {font:`400 44px ${FMono}`, color:isHL?C.gold:'#6E6E85', align:'center'});
    if(isHL){
      const pip = .5+.5*Math.sin(t*3.2);
      ctx.globalAlpha = .5+.5*pip;
      ctx.fillStyle=C.gold; ctx.beginPath(); ctx.arc(x0+CARD_W/2, y-14, 4.5, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  });

  // ---- 计数器：数字滚动 ----
  const cnt = Math.round(easeInOut(seg(t,2.2,3.6))*37);
  const ca = easeOut(seg(t,2.0,2.6));
  text(String(cnt).padStart(2,'0'), 1650, 660, {font:`400 96px ${FMono}`,color:C.gold,align:'right',alpha:ca,shadow:26,sc:'rgba(201,169,106,.7)'});
  text('先看 %', 1650, 706, {font:`400 24px ${FS}`,color:C.gray,align:'right',alpha:ca});
  text('模拟 1,000 次 · 成功率 37.4%', 1650, 750, {font:`400 21px ${FS}`,color:C.dim,align:'right',alpha:ca});

  // ---- 注释带 ----
  const na = easeOut(seg(t,3.2,3.9));
  text('过 37 就出手 —— 数学上最优的停止点', W/2, 792, {font:`400 25px ${FS}`,color:C.gray,align:'center',alpha:.9*na});
  ctx.save(); ctx.globalAlpha=.25*na; ctx.strokeStyle=C.gold; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(W/2,806); ctx.lineTo(W/2,820); ctx.stroke(); ctx.restore();

  // ---- 双语字幕 ----
  const sa = easeOut(seg(t,3.6,4.3));
  text('先看 37%，再出手', W/2, 900, {font:`700 46px ${FS}`,color:C.white,align:'center',alpha:sa,shadow:24,sc:'rgba(0,0,0,.85)'});
  text('Look at the first 37%. Then leap.', W/2, 946, {font:`italic 400 27px ${FLatin}`,color:'#9C9CB4',align:'center',alpha:.95*sa});
};
window.READY = false;
(async()=>{ try{ await document.fonts.ready; }catch(e){}
  window.READY = true;
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { window.render(parseFloat(q.get('t'))); return; }
  const t0 = performance.now();
  const loop = ()=>{ window.render(((performance.now()-t0)/1000)%window.DUR); requestAnimationFrame(loop); };
  loop();
})();
</script>
</body></html>
