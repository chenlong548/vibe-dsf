<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>六年 · 64s</title>
<style>html,body{margin:0;background:#150A08;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   《六年》 64s / 1920×1080 / 30fps / 落日暖调 / 全中文 / 无旁白
   场景：
     S1  0.0– 8.0  旧书店：窗光、浮尘、纸条递入
     S2  8.0–16.0  纸条特写：字逐个浮现
     S3 16.0–24.0  他没有答应：折好、放回
     S4 24.0–28.5  这句话请藏在心里：纸边光 + 金线起
     S5 28.5–36.5  时间轴：14 → 18 → 20
     S6 36.5–44.5  大学门口：背影、光
     S7 44.5–48.5  还不够：光点从 18 滑到 20
     S8 48.5–56.5  生日桌面：两张纸并排
     S9 56.5–60.0  他问
     S10 60.0–64.0 片名卡
   ===================================================================== */
const W=1920,H=1080; window.DUR=64;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

const FS='"Microsoft YaHei","PingFang SC",sans-serif';
const FK='"KaiTi","STKaiti","楷体",SimSun,serif';
const FT='"Noto Serif SC","Songti SC",SimSun,serif';

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const easeIn=x=>x*x*x;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const bokeh=(()=>{const r=mulberry32(77),p=[];
  for(let i=0;i<16;i++)p.push({x:r()*W,y:r()*H*.8,r:50+r()*150,ph:r()*6.28,sp:.12+r()*.25,a:.10+r()*.16,
    hue:r()<.5?'255,214,160':'255,182,120'});return p;})();
const dust=(()=>{const r=mulberry32(9),p=[];
  for(let i=0;i<70;i++)p.push({x:r()*W,y:r()*H,r:.8+r()*1.8,ph:r()*6.28,sp:.3+r()*.7,a:.15+r()*.35});return p;})();
const grain=(()=>{const r=mulberry32(5),p=[];
  for(let i=0;i<800;i++)p.push({x:r()*W,y:r()*H,a:.01+r()*.028,s:1+r()*1.6});return p;})();

/* ---------- 文字 ---------- */
function text(str,x,y,{font=`400 40px ${FS}`,color='#F6ECD8',align='left',alpha=1,shadow=0,sc='rgba(0,0,0,.7)'}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;
  if(shadow>0){ctx.shadowBlur=shadow;ctx.shadowColor=sc;}
  ctx.fillText(str,x,y);ctx.restore();
}
function tracked(str,x,y,tr,{font=`500 21px ${FS}`,color='#E0B87A',align='left',alpha=1}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.fillStyle=color;
  const ch=[...str],w=ch.map(c=>ctx.measureText(c).width);
  const tot=w.reduce((a,b)=>a+b,0)+tr*Math.max(0,ch.length-1);
  let cx=align==='center'?x-tot/2:align==='right'?x-tot:x;
  ch.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=w[i]+tr;});ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ---------- 背景（所有场景共用） ---------- */
function backdrop(t,{shaftX=W*.30}={}){
  const g=ctx.createRadialGradient(W*.38,H*.30,40,W*.55,H*.62,W*.95);
  g.addColorStop(0,'#3A1F14'); g.addColorStop(.45,'#22110C'); g.addColorStop(1,'#120806');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  const lg=ctx.createRadialGradient(shaftX,H*.18,20,shaftX,H*.18,760);
  lg.addColorStop(0,'rgba(255,206,150,.30)');
  lg.addColorStop(.35,'rgba(255,168,110,.12)');
  lg.addColorStop(1,'rgba(255,150,90,0)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);

  const shaft=ctx.createLinearGradient(0,0,W*.9,H);
  shaft.addColorStop(0,'rgba(255,196,140,.13)');
  shaft.addColorStop(.35,'rgba(255,170,110,.05)');
  shaft.addColorStop(1,'rgba(255,150,90,0)');
  ctx.save(); ctx.beginPath();
  ctx.moveTo(W*.06,-40); ctx.lineTo(W*.40,-40); ctx.lineTo(W*.78,H+40); ctx.lineTo(W*.40,H+40);
  ctx.closePath(); ctx.fillStyle=shaft; ctx.fill(); ctx.restore();

  for(const b of bokeh){
    const yy=b.y+Math.sin(t*b.sp+b.ph)*14;
    const bg=ctx.createRadialGradient(b.x,yy,0,b.x,yy,b.r);
    bg.addColorStop(0,`rgba(${b.hue},${b.a})`);
    bg.addColorStop(.65,`rgba(${b.hue},${b.a*.45})`);
    bg.addColorStop(1,`rgba(${b.hue},0)`);
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(b.x,yy,b.r,0,6.283); ctx.fill();
  }
  for(const d of dust){
    const yy=d.y+Math.sin(t*d.sp+d.ph)*10;
    const xx=d.x+Math.cos(t*d.sp*.7+d.ph)*6;
    ctx.globalAlpha=d.a*(.5+.5*Math.sin(t*1.6+d.ph));
    ctx.fillStyle='#FFE3BE';
    ctx.beginPath(); ctx.arc(xx,yy,d.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ---------- 纸条 ---------- */
function paper(cx,cy,pw,phh,rot,alpha,typed,opts={}){
  if(alpha<=0.002) return;
  const {line1='等我长大，',line2='我嫁给你。',sign='— 她，十四岁',signAlpha=1,glow=0,scroll=0,inkAlpha=1}=opts;
  const content1=[...line1], content2=[...line2];
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(cx,cy);
  ctx.rotate(rot*Math.PI/180);
  // scroll: 横向折叠（0=完整，1=完全折起）
  const sx=1-0.62*scroll;
  ctx.scale(sx,1);
  ctx.shadowBlur=90; ctx.shadowColor='rgba(0,0,0,.72)';
  rr(-pw/2,-phh/2,pw,phh,3);
  const pg=ctx.createLinearGradient(-pw/2,-phh/2,pw/2,phh/2);
  pg.addColorStop(0,'#FFF9EC'); pg.addColorStop(.5,'#F7EBD5'); pg.addColorStop(1,'#EBDCC0');
  ctx.fillStyle=pg; ctx.fill();
  ctx.shadowBlur=0;
  if(glow>0){ ctx.strokeStyle=`rgba(255,226,180,${.55*glow})`; ctx.lineWidth=1.6; rr(-pw/2,-phh/2,pw,phh,3); ctx.stroke(); }

  ctx.save(); rr(-pw/2,-phh/2,pw,phh,3); ctx.clip();
  const r2=mulberry32(31);
  for(let i=0;i<260;i++){
    ctx.globalAlpha=alpha*(.02+r2()*.03); ctx.fillStyle='#8A6A48';
    ctx.fillRect(-pw/2+r2()*pw, -phh/2+r2()*phh, 1+r2()*2, 1+r2()*2);
  }
  ctx.restore();
  ctx.globalAlpha=alpha;

  // 手写字
  ctx.font=`400 62px ${FK}`;
  ctx.fillStyle='#3A2A22';
  ctx.textAlign='center';
  let shown=0;
  const drawLine=(chars,yy)=>{
    const widths=chars.map(c=>ctx.measureText(c).width);
    const tot=widths.reduce((a,b)=>a+b,0);
    let x=-tot/2;
    chars.forEach((ch,i)=>{
      if(shown<typed){ ctx.globalAlpha=alpha*inkAlpha*clamp((typed-shown)*1.2,0,1); ctx.fillText(ch,x+widths[i]/2,yy); }
      shown++; x+=widths[i];
    });
  };
  drawLine(content1,-10);
  drawLine(content2,84);

  const total=content1.length+content2.length;
  if(typed>=total && sign){
    ctx.globalAlpha=alpha*signAlpha*.72;
    ctx.font=`400 27px ${FK}`; ctx.fillStyle='#6B5240'; ctx.textAlign='right';
    ctx.fillText(sign, pw/2-44, phh/2-24);   // 压低到纸的下缘，避免与第二行撞
  }
  ctx.restore();
}

/* ---------- 时间轴 ---------- */
function timeline(t,{alpha=1,y=620,ageFrom=14,ageTo=20,x0=420,x1=1460,dotAge=null}={}){
  if(alpha<=0.002) return;
  ctx.save(); ctx.globalAlpha=alpha;
  // 底线
  ctx.strokeStyle='rgba(255,226,180,.28)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
  // 刻度
  const ages=[14,15,16,17,18,19,20];
  const px=a=>x0+(x1-x0)*(a-ageFrom)/(ageTo-ageFrom);
  ages.forEach(a=>{
    const big=(a===14||a===18||a===20);
    ctx.strokeStyle=big?'rgba(255,226,180,.85)':'rgba(255,226,180,.30)';
    ctx.lineWidth=big?2.2:1.2;
    ctx.beginPath(); ctx.moveTo(px(a),y-(big?14:7)); ctx.lineTo(px(a),y+(big?14:7)); ctx.stroke();
    if(big){
      text(`${a} 岁`,px(a),y+52,{font:`400 ${a===20?34:26}px ${FS}`,color:a===20?'#E0B87A':'#B08A62',align:'center'});
    }
  });
  // 光点
  if(dotAge!==null){
    const dx=px(dotAge);
    ctx.save();
    ctx.shadowBlur=30; ctx.shadowColor='rgba(224,184,122,.95)';
    ctx.fillStyle='#F5E4BE';
    ctx.beginPath(); ctx.arc(dx,y-26,7,0,6.283); ctx.fill();
    ctx.restore();
    ctx.strokeStyle='rgba(224,184,122,.45)'; ctx.lineWidth=1;
    ctx.setLineDash([3,6]);
    ctx.beginPath(); ctx.moveTo(dx,y-26); ctx.lineTo(dx,y); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

/* ---------- 人物：只拍背影的半身（不画脸） ---------- */
function bust(cx, bottomY, s, alpha, rim=1){
  if(alpha<=0.002) return;
  const headR=92*s, headCY=bottomY-430*s;
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle='#180C08';
  // 肩：从画面底部切出来（不画完整人形，避免"火柴人"）
  ctx.beginPath();
  ctx.moveTo(cx-320*s, bottomY);
  ctx.quadraticCurveTo(cx-306*s, bottomY-205*s, cx-146*s, bottomY-268*s);
  ctx.lineTo(cx+146*s, bottomY-268*s);
  ctx.quadraticCurveTo(cx+306*s, bottomY-205*s, cx+320*s, bottomY);
  ctx.closePath(); ctx.fill();
  // 脖子
  ctx.fillRect(cx-52*s, headCY+headR*.55, 104*s, 96*s);
  // 头（略椭圆，不要正圆）
  ctx.beginPath(); ctx.ellipse(cx, headCY, headR*.94, headR, 0, 0, 6.283); ctx.fill();
  // 头发：后脑一团 + 低马尾（读起来更像"她"）
  ctx.beginPath();
  ctx.ellipse(cx+headR*.10, headCY-headR*.22, headR*1.02, headR*.92, 0, Math.PI*.98, Math.PI*2.02);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+headR*.55, headCY+headR*.30);
  ctx.quadraticCurveTo(cx+headR*1.25, headCY+headR*1.05, cx+headR*1.05, headCY+headR*1.95);
  ctx.quadraticCurveTo(cx+headR*.62, headCY+headR*1.30, cx+headR*.35, headCY+headR*.55);
  ctx.closePath(); ctx.fill();
  // 轮廓光（光从左后方来 → 只描左侧）
  ctx.globalAlpha=alpha*rim*.85;
  ctx.strokeStyle='rgba(255,210,155,.9)'; ctx.lineWidth=3.5*s; ctx.lineCap='round';
  ctx.beginPath(); ctx.ellipse(cx, headCY, headR*.94, headR, 0, Math.PI*.92, Math.PI*1.58); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-146*s, bottomY-268*s);
  ctx.quadraticCurveTo(cx-306*s, bottomY-205*s, cx-320*s, bottomY);
  ctx.stroke();
  ctx.restore();
}

/* ---------- 地面影子（拉长、模糊，读作"两个人站在光里"） ---------- */
function groundShadow(cx, cy, s){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1.95, .48);
  ctx.beginPath(); ctx.ellipse(0,0, 150*s, 92*s, 0, 0, 6.283); ctx.fill();   // 身体投影
  ctx.beginPath(); ctx.arc(-46*s, -62*s, 44*s, 0, 6.283); ctx.fill();        // 头部投影
  ctx.restore();
}

/* ---------- 压暗（无纸场景用，避免散景把画面洗灰） ---------- */
function scrim(alpha, stop=.55){
  if(alpha<=0.002) return;
  const g=ctx.createRadialGradient(W*.5,H*.45,H*.18,W*.5,H*.5,H*.95);
  g.addColorStop(0,`rgba(10,4,3,${alpha*stop})`);
  g.addColorStop(1,`rgba(8,3,2,${alpha})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

/* ---------- 字幕（中文单语） ---------- */
const SUBS=[
  [0.8, 4.6,  '十四岁那年，她塞给二十岁的他一张纸条'],
  [4.6, 8.0,  '收纸条的人，是隔壁书店的店员'],
  [8.6, 12.0, '纸上只有一句话'],
  [12.0,16.0, '这句话她写了三遍才递出去'],
  [16.4,20.4, '他没有答应'],
  [20.4,24.4, '他把纸条折好，放回她手心'],
  [24.4,28.4, '说：这句话，请藏在心里'],
  [28.8,32.4, '等你二十岁'],
  [32.4,36.4, '你要是还想说，再亲口告诉我'],
  [36.8,40.4, '四年后，她十八岁'],
  [40.4,44.4, '站在他面前说：我长大了'],
  [44.8,48.4, '他摇头：还不够'],
  [48.8,52.6, '长大不是年龄，是能自己回答'],
  [52.6,56.4, '二十岁生日，她把那张纸条摊开'],
  [56.8,60.0, '他问：这回，是你自己说的吗']
];
function subs(t){
  for(const [a,b,s] of SUBS){
    const al=Math.min(seg(t,a,a+.5),1-seg(t,b-.3,b));
    if(al<=0.001) continue;
    text(s,W/2,912+(1-easeOut(seg(t,a,a+.5)))*10,
      {font:`700 52px ${FS}`,color:'#F6ECD8',align:'center',alpha:al,shadow:30,sc:'rgba(0,0,0,.9)'});
  }
}

/* ---------- 顶栏 ---------- */
function hud(t){
  const a=easeOut(seg(t,.4,1.4))*(1-seg(t,60.2,60.8));
  tracked('@你的名字',84,74,3,{color:'#B08A62',alpha:.8*a});
  tracked('爱情 · 六年',W/2,74,3,{align:'center',alpha:.9*a});
  const f=Math.floor((t%1)*30), s=Math.floor(t)%60, m=Math.floor(t/60);
  text(`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`,W-84,74,
    {font:`400 21px Consolas,monospace`,color:'#7A5A44',align:'right',alpha:.8*a});
}

/* ---------- 收尾层 ---------- */
function vignette(){
  const v=ctx.createRadialGradient(W/2,H/2,H*.30,W/2,H/2,H*1.05);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(20,6,4,.72)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  for(const p of grain){ ctx.globalAlpha=p.a; ctx.fillStyle='#FFE9CC'; ctx.fillRect(p.x,p.y,p.s,p.s); }
  ctx.globalAlpha=1;
}

/* =====================================================================
   主渲染
   ===================================================================== */
window.render=function(t){
  const TS=t;
  // 黑场进出
  const fadeIn=1-seg(TS,0,.6), fadeOut=seg(TS,63.2,64);

  backdrop(TS);

  /* S1 书店 0.4–8.0 */
  if(TS>0.3&&TS<8.2){
    const a=easeOut(seg(TS,.4,1.6));
    // 只留光与尘：书架用"一片更亮的暖区"暗示，不画具体书脊（画出来像条码）
    ctx.save(); ctx.globalAlpha=a*.5;
    const wg=ctx.createLinearGradient(W*.58,0,W*.95,0);
    wg.addColorStop(0,'rgba(255,196,140,0)');
    wg.addColorStop(.5,'rgba(255,200,150,.10)');
    wg.addColorStop(1,'rgba(255,180,120,0)');
    ctx.fillStyle=wg; ctx.fillRect(W*.58,H*.16,W*.37,H*.70);
    ctx.restore();
    // 纸条从右下递入（已经写好，S2 才推近看清）
    const pin=easeOutBack(seg(TS,5.2,6.8));
    if(pin>0.001){
      paper(W*.56+(1-pin)*300, H*.50+(1-pin)*200, 520, 300, -6+Math.sin(TS*.5)*.4, clamp(pin,0,1)*.95, 14, {glow:.3});
    }
  }

  /* S2 纸条特写 8.0–16.0 */
  if(TS>=7.8&&TS<16.3){
    const t2=TS;
    const zoom=easeInOut(seg(t2,8.0,9.2));
    const pw=700+120*zoom, phh=400+70*zoom;
    const typed=t2<8.6?0:Math.floor(easeInOut(seg(t2,8.6,13.4))*14);
    const sx=easeOut(seg(t2,13.8,14.6));
    paper(W*.5, H*.44, pw, phh, -4+Math.sin(t2*.5)*.35, 1-seg(t2,15.9,16.25),
      typed, {glow:.35, signAlpha:sx});
  }

  /* S3 折好放回 16.0–24.0 */
  if(TS>=16.0&&TS<24.2){
    const scroll=easeInOut(seg(TS,21.0,22.6));
    const ex=easeInOut(seg(TS,22.4,23.8));
    paper(W*.5-ex*230, H*.44+ex*40, 820, 430, -4+ex*3, 1-seg(TS,23.9,24.15), 14,
      {glow:.35, scroll, signAlpha:1});
  }

  /* S4 金线起 24.0–28.6 */
  if(TS>=24.0&&TS<28.7){
    const a=1-seg(TS,28.2,28.6);
    const lineW=easeOut(seg(TS,25.4,27.2));
    if(lineW>0.001){
      ctx.save(); ctx.globalAlpha=a*.9;
      ctx.strokeStyle='rgba(224,184,122,.85)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(W*.42,H*.44); ctx.lineTo(W*.42+lineW*W*.42,H*.44); ctx.stroke();
      ctx.restore();
    }
  }

  /* S5 时间轴 28.5–36.5 */
  if(TS>=28.5&&TS<36.7){
    scrim(easeOut(seg(TS,28.5,29.6))*.62);
    const a=easeOut(seg(TS,28.6,30.2));
    const grow=easeInOut(seg(TS,29.0,31.6));
    timeline(TS,{alpha:a, y:568, x0:380, x1:380+(1520-380)*grow, dotAge:null});
    if(grow>0.98){
      const da=14+2*easeInOut(seg(TS,31.8,33.4));
      timeline(TS,{alpha:a*.95, y:568, dotAge:da});
    }
  }

  /* S6 大学门口：背光的纸条（她把它带回来了） 36.5–44.5 */
  if(TS>=36.4&&TS<44.7){
    scrim(easeOut(seg(TS,36.5,37.8))*.5);
    const a=easeOut(seg(TS,36.6,38.4));
    // 逆光：纸背后一团强光，把纸"照透"
    ctx.save(); ctx.globalAlpha=a*.95;
    const gl=ctx.createRadialGradient(W*.52,H*.42,20,W*.52,H*.42,560);
    gl.addColorStop(0,'rgba(255,225,180,.42)');
    gl.addColorStop(.4,'rgba(255,190,135,.18)');
    gl.addColorStop(1,'rgba(255,165,110,0)');
    ctx.fillStyle=gl; ctx.fillRect(0,0,W,H);
    ctx.restore();
    // 纸：反方向微旋、更大、字被光"晒淡"
    const push=easeOut(seg(TS,37.0,43.2));
    const pw=640+120*push, phh=376+70*push;
    paper(W*.47, H*.42, pw, phh, 7.5-Math.sin(TS*.55)*.6, a*.96, 14,
      {glow:1, signAlpha:1, inkAlpha:.52});
    // 纸面过曝：一层暖白叠加，让它像被逆光烧透
    ctx.save(); ctx.globalAlpha=a*.20; ctx.filter='blur(30px)';
    ctx.fillStyle='rgba(255,240,210,.9)';
    rr(W*.47-pw*.42, H*.42-phh*.40, pw*.84, phh*.80, 40); ctx.fill();
    ctx.restore();
  }

  /* S7 光点 18→20  44.5–48.5 */
  if(TS>=44.5&&TS<48.7){
    const a=easeOut(seg(TS,44.6,45.4));
    timeline(TS,{alpha:a, y:620, dotAge:18+2*easeInOut(seg(TS,45.2,47.6))});
    const na=easeOut(seg(TS,46.4,47.2));
    text('还不够',W/2,760,{font:`700 54px ${FS}`,color:'#E0B87A',align:'center',alpha:na,shadow:26,sc:'rgba(0,0,0,.8)'});
  }

  /* S8 生日桌面：两张纸 48.5–56.5 */
  if(TS>=48.4&&TS<56.7){
    scrim(easeOut(seg(TS,48.5,49.6))*.45);
    const a=easeOut(seg(TS,48.6,49.6));
    // 她的纸（左，微旋）
    paper(W*.5-300, H*.44, 600, 380, -3.4, a, 14, {glow:.3, signAlpha:1});
    // 他的纸：从右侧滑入
    const pin=easeOut(seg(TS,51.2,53.0));
    if(pin>0.02){
      paper(W*.5+300+(1-pin)*280, H*.47, 540, 340, 3.6, a*clamp(pin,0,1), 9,
        {line1:'是你自己',line2:'说的吗',sign:'— 他，二十六岁',signAlpha:1,glow:.25});
    }
  }

  /* S9 他问 56.5–60.0 */
  if(TS>=56.5&&TS<60.4){
    const a=1-seg(TS,59.6,60.3);
    timeline(TS,{alpha:a*.8, y:690, dotAge:20});
  }

  /* S10 片名卡 60.0–64.0 */
  if(TS>=59.9){
    scrim(easeOut(seg(TS,59.9,60.8))*.72);
    const a=easeOut(seg(TS,60.1,61.0));
    text('《六年》',W/2,596+(1-a)*12,{font:`900 104px ${FT}`,color:'#E0B87A',align:'center',alpha:a,shadow:48,sc:'rgba(224,184,122,.45)'});
    const b=easeOut(seg(TS,61.0,61.9));
    text('爱不是提前占有',W/2,700,{font:`400 36px ${FS}`,color:'#D8C8B8',align:'center',alpha:b});
    const c=easeOut(seg(TS,61.7,62.5));
    text('是等一个人长到能自己回答',W/2,754,{font:`400 36px ${FS}`,color:'#D8C8B8',align:'center',alpha:c});
    const d=easeOut(seg(TS,62.6,63.2));
    text('@你的名字 出品 · 全片由代码渲染 · 无实拍素材',W/2,842,{font:`400 20px ${FS}`,color:'#8A6A50',align:'center',alpha:d*.9});
  }

  hud(TS);
  subs(TS);
  vignette();

  if(fadeIn>0){ ctx.save(); ctx.globalAlpha=fadeIn; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.restore(); }
  if(fadeOut>0){ ctx.save(); ctx.globalAlpha=fadeOut; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.restore(); }
};

window.READY=false;
(async()=>{ try{ await document.fonts.ready; }catch(e){}
  window.READY=true;
  const q=new URLSearchParams(location.search);
  if(q.has('t')){ window.render(parseFloat(q.get('t'))); return; }
  const t0=performance.now();
  const loop=()=>{ window.render(((performance.now()-t0)/1000)%window.DUR); requestAnimationFrame(loop); };
  loop();
})();
</script>
</body></html>
