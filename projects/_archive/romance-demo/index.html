<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>浪漫风 · 落日暖调 验证帧</title>
<style>html,body{margin:0;background:#150A08;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ============ 风格包 D「落日暖调」验证片段 ============
   配方：暖棕底 + 逆光光晕 + 散景光斑 + 浮尘 + 胶片颗粒
        + 米白纸条（微旋）+ 楷体手写感 + 中文单语字幕（无英文）
   场景：旧书店，一张纸条递出去的那一秒
*/
const W=1920,H=1080; window.DUR=6;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const FS='"Microsoft YaHei","PingFang SC",sans-serif';
const FK='"KaiTi","STKaiti","楷体",SimSun,serif';
const FT='"Noto Serif SC","Songti SC",SimSun,serif';

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOutBack=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* 散景光斑：14 个，暖色，慢速上浮 */
const bokeh=(()=>{const r=mulberry32(77),p=[];
  for(let i=0;i<16;i++)p.push({x:r()*W,y:r()*H*.8,r:50+r()*150,ph:r()*6.28,sp:.12+r()*.25,a:.10+r()*.16,
    hue:r()<.5?'255,214,160':'255,182,120'});return p;})();
/* 浮尘：70 个微点 */
const dust=(()=>{const r=mulberry32(9),p=[];
  for(let i=0;i<70;i++)p.push({x:r()*W,y:r()*H,r:.8+r()*1.8,ph:r()*6.28,sp:.3+r()*.7,a:.15+r()*.35});return p;})();
/* 胶片颗粒 */
const grain=(()=>{const r=mulberry32(5),p=[];
  for(let i=0;i<800;i++)p.push({x:r()*W,y:r()*H,a:.01+r()*.028,s:1+r()*1.6});return p;})();

function text(str,x,y,{font=`400 40px ${FS}`,color='#F6ECD8',align='left',alpha=1,shadow=0,sc='rgba(0,0,0,.7)'}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;
  if(shadow>0){ctx.shadowBlur=shadow;ctx.shadowColor=sc;}
  ctx.fillText(str,x,y);ctx.restore();
}
function tracked(str,x,y,tr,{font=`500 21px ${FS}`,color='#E0B87A',align='left',alpha=1}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font;ctx.fillStyle=color;
  const ch=[...str],w=ch.map(c=>ctx.measureText(c).width);
  const tot=w.reduce((a,b)=>a+b,0)+tr*Math.max(0,ch.length-1);
  let cx=align==='center'?x-tot/2:align==='right'?x-tot:x;
  ch.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=w[i]+tr;});ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

window.render=function(t){
  // ---- 暖棕底：右下暗、左上暖 ----
  const g=ctx.createRadialGradient(W*.38,H*.30,40,W*.55,H*.62,W*.95);
  g.addColorStop(0,'#3A1F14'); g.addColorStop(.45,'#22110C'); g.addColorStop(1,'#120806');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // ---- 逆光光晕（书店窗光）----
  const lg=ctx.createRadialGradient(W*.30,H*.18,20,W*.30,H*.18,760);
  lg.addColorStop(0,'rgba(255,206,150,.30)');
  lg.addColorStop(.35,'rgba(255,168,110,.12)');
  lg.addColorStop(1,'rgba(255,150,90,0)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);

  // ---- 斜射窗光：一道柔和的暖光带（替代书架剪影）----
  const shaft=ctx.createLinearGradient(0,0,W*.9,H);
  shaft.addColorStop(0,'rgba(255,196,140,.13)');
  shaft.addColorStop(.35,'rgba(255,170,110,.05)');
  shaft.addColorStop(1,'rgba(255,150,90,0)');
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(W*.06,-40); ctx.lineTo(W*.40,-40); ctx.lineTo(W*.78,H+40); ctx.lineTo(W*.40,H+40);
  ctx.closePath(); ctx.fillStyle=shaft; ctx.fill();
  ctx.restore();

  // ---- 散景光斑 ----
  for(const b of bokeh){
    const yy=b.y+Math.sin(t*b.sp+b.ph)*14;
    const bg=ctx.createRadialGradient(b.x,yy,0,b.x,yy,b.r);
    bg.addColorStop(0,`rgba(${b.hue},${b.a})`);
    bg.addColorStop(.65,`rgba(${b.hue},${b.a*.45})`);
    bg.addColorStop(1,`rgba(${b.hue},0)`);
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(b.x,yy,b.r,0,6.283); ctx.fill();
  }

  // ---- 浮尘 ----
  for(const d of dust){
    const yy=d.y+Math.sin(t*d.sp+d.ph)*10;
    const xx=d.x+Math.cos(t*d.sp*.7+d.ph)*6;
    ctx.globalAlpha=d.a*(.5+.5*Math.sin(t*1.6+d.ph));
    ctx.fillStyle='#FFE3BE';
    ctx.beginPath(); ctx.arc(xx,yy,d.r,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ---- 纸条：米白、微旋、投影 ----
  const ap=easeOutBack(seg(t,.3,1.4));
  if(ap>0.001){
    const pw=760, phh=430;
    const cx=W*.5, cy=H*.44;
    ctx.save();
    ctx.globalAlpha=clamp(ap,0,1);
    ctx.translate(cx,cy);
    ctx.rotate((-4+Math.sin(t*.5)*.35)*Math.PI/180);   // 极慢摆动
    ctx.scale(.94+.06*clamp(ap,0,1), .94+.06*clamp(ap,0,1));
    ctx.shadowBlur=90; ctx.shadowColor='rgba(0,0,0,.72)';
    rr(-pw/2,-phh/2,pw,phh,3);
    const pg=ctx.createLinearGradient(-pw/2,-phh/2,pw/2,phh/2);
    pg.addColorStop(0,'#FFF9EC'); pg.addColorStop(.5,'#F7EBD5'); pg.addColorStop(1,'#EBDCC0');
    ctx.fillStyle=pg; ctx.fill();
    ctx.shadowBlur=0;
    // 纸边被暖光打亮
    ctx.save();
    ctx.strokeStyle='rgba(255,226,180,.55)'; ctx.lineWidth=1.6;
    rr(-pw/2,-phh/2,pw,phh,3); ctx.stroke();
    ctx.restore();
    // 纸纹
    ctx.save(); rr(-pw/2,-phh/2,pw,phh,3); ctx.clip();
    const r2=mulberry32(31);
    for(let i=0;i<260;i++){
      ctx.globalAlpha=.02+r2()*.03; ctx.fillStyle='#8A6A48';
      ctx.fillRect(-pw/2+r2()*pw, -phh/2+r2()*phh, 1+r2()*2, 1+r2()*2);
    }
    ctx.restore();
    ctx.globalAlpha=clamp(ap,0,1);

    // 手写字（楷体，逐字浮现）
    const line1='等我长大，';
    const line2='我嫁给你。';
    const c1=[...line1], c2=[...line2];
    const total=c1.length+c2.length;
    const typed=Math.floor(easeInOut(seg(t,1.4,3.4))*total);
    ctx.font=`400 62px ${FK}`;
    ctx.fillStyle='#3A2A22';
    ctx.textAlign='center';
    let shown=0;
    const drawLine=(chars,yy)=>{
      const widths=chars.map(c=>ctx.measureText(c).width);
      const tot=widths.reduce((a,b)=>a+b,0);
      let x=-tot/2;
      const per=tot/chars.length;
      chars.forEach((ch,i)=>{
        if(shown<typed){ ctx.globalAlpha=clamp(ap,0,1)*clamp((typed-shown)*1.2,0,1); ctx.fillText(ch,x+widths[i]/2,yy); }
        shown++; x+=widths[i];
      });
    };
    drawLine(c1,-10);
    drawLine(c2,84);

    // 落款：一个小小的"她"（笔迹感）
    if(typed>=total){
      const sa=easeOut(seg(t,3.4,3.9));
      ctx.globalAlpha=clamp(ap,0,1)*sa*.75;
      ctx.font=`400 30px ${FK}`; ctx.fillStyle='#6B5240'; ctx.textAlign='right';
      ctx.fillText('— 她，十四岁', pw/2-56, phh/2-46);
    }
    ctx.restore();
  }

  // ---- 顶栏（全中文）----
  const hud=easeOut(seg(t,.1,.8));
  tracked('@你的名字',84,74,3,{color:'#B08A62',alpha:.8*hud});
  tracked('爱情 · 六年',W/2,74,3,{align:'center',alpha:.9*hud});
  text('00:0'+Math.floor(t)+':'+String(Math.floor((t%1)*30)).padStart(2,'0'),W-84,74,
       {font:`400 21px Consolas,monospace`,color:'#7A5A44',align:'right',alpha:.8*hud});

  // ---- 中文单语字幕（无英文，字号放大到 54px）----
  const sa=easeOut(seg(t,2.6,3.5));
  text('十四岁那年，她把一张纸条塞给了一个二十岁的人',W/2,912,
       {font:`700 52px ${FS}`,color:'#F6ECD8',align:'center',alpha:sa,shadow:30,sc:'rgba(0,0,0,.9)'});

  // ---- 暗角 ----
  const v=ctx.createRadialGradient(W/2,H/2,H*.30,W/2,H/2,H*1.05);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(20,6,4,.72)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);

  // ---- 颗粒 ----
  for(const p of grain){ ctx.globalAlpha=p.a; ctx.fillStyle='#FFE9CC'; ctx.fillRect(p.x,p.y,p.s,p.s); }
  ctx.globalAlpha=1;
};
window.READY=false;
(async()=>{ try{ await document.fonts.ready; }catch(e){}
  window.READY=true;
  const q=new URLSearchParams(location.search);
  if(q.has('t')){ window.render(parseFloat(q.get('t'))); return; }
  const t0=performance.now();
  const loop=()=>{ window.render(((performance.now()-t0)/1000)%window.DUR); requestAnimationFrame(loop); };
  loop();
})();
</script>
</body></html>
