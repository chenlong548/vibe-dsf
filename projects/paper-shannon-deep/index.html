    /* paper 模式：正交发丝线网格（图纸感），近静止，运动由萤火层承担 */
    ctx.strokeStyle = `rgba(${ACCENT_DIM},${LIGHT ? 0.055 : 0.05})`; ctx.lineWidth = 1;
    const sp = 96, dx = (drift * 0.3) % sp;
    for (let i = 0; i * sp < W + sp; i++){
      ctx.beginPath(); ctx.moveTo(i * sp - dx, 0); ctx.lineTo(i * sp - dx, H); ctx.stroke();
    }
    for (let j = 0; j * sp < H + sp; j++){
      ctx.beginPath(); ctx.moveTo(0, j * sp); ctx.lineTo(W, j * sp); ctx.stroke();
    }
  } else {
    ctx.strokeStyle = `rgba(${ACCENT_DIM},0.05)`; ctx.lineWidth = 1.4;
    for (let i = 1; i <= 9; i++){
      ctx.beginPath(); ctx.arc(W*0.42, H*0.40, i*120, 0, Math.PI*2); ctx.stroke();
    }
  }
  for (const p of AMBIENT){
    const x = ((p.x + p.vx*t) % W + W) % W;
    const y = ((p.y + p.vy*t) % H + H) % H;
    const a = p.a * (0.55 + 0.45 * Math.sin(t*p.w + p.ph));
    ctx.fillStyle = p.accent ? `rgba(${ACCENT_DIM},${a.toFixed(3)})` : `rgba(${INK_DIM},${(a*0.85).toFixed(3)})`;
    ctx.fillRect(x, y, p.s, p.s);
  }
  for (const [x, y, a, s] of STARS){
    const tw = 0.75 + 0.25 * Math.sin(t*1.8 + x);
    ctx.fillStyle = `rgba(${INK_DIM},${(a * tw).toFixed(3)})`;
    ctx.fillRect(x, (y - drift + H) % H, s, s);
  }
  for (const [x, y, a] of GRAIN){
    ctx.fillStyle = LIGHT ? `rgba(22,24,28,${(a * 0.45).toFixed(3)})` : `rgba(255,255,255,${a})`;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
}
function vignette(){
  if (LIGHT){
    /* 浅底：纸面边缘墨影。边中点 alpha≈0.086（亮度 252→232，压住 QA 的 235 亮边检测线），
     * 四角≈0.18（像被拍摄的纸面）。只影响 LIGHT 分支，深空片零变化。 */
    const v = ctx.createRadialGradient(W/2, H/2, H*0.30, W/2, H/2, H*0.72);
    v.addColorStop(0, 'rgba(22,24,28,0)'); v.addColorStop(1, 'rgba(22,24,28,0.18)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    return;
  }
  const v = ctx.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, H*0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ---------- 内置 L1（rings / grid） ---------- */
function drawBuiltinL1(l1, sc, t){
  const at = l1.at || [(sc.l2 && sc.l2.params && sc.l2.params.cx) ?? 0.42,
                       (sc.l2 && sc.l2.params && sc.l2.params.cy) ?? 0.42];
  const cx = at[0]*W, cy = at[1]*H;
  const g = easeOutCubic(seg(t, l1.grow[0], l1.grow[1]));
  if (g <= 0) return;
  const lw = Math.max(2, l1.stroke || 2);
  if (l1.kind === 'rings'){
    const rot = t * 0.05;
    for (let i = 1; i <= 5; i++){
      const rr = i * 118 * g;
      if (rr < 4) continue;
      ctx.strokeStyle = `rgba(${ACCENT_DIM},${0.06 + i*0.014})`;
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI*2); ctx.stroke();
      for (let k = 0; k < 4; k++){
        const ang = k*Math.PI/2 + i*0.35 - rot*1.6;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang)*(rr-5), cy + Math.sin(ang)*(rr-5));
        ctx.lineTo(cx + Math.cos(ang)*(rr+5), cy + Math.sin(ang)*(rr+5));
        ctx.stroke();
      }
    }
  } else if (l1.kind === 'grid'){
    ctx.strokeStyle = `rgba(${INK_DIM},0.10)`;
    ctx.lineWidth = lw;
    const sp = 150;
    const cols = Math.ceil(W*0.84/sp * g);
    for (let i = 0; i <= cols; i++){
      const x = W*0.08 + i*sp;
      if (x > W*0.92) break;
      ctx.beginPath(); ctx.moveTo(x, H*0.14); ctx.lineTo(x, H*0.80); ctx.stroke();
    }
    const rows = Math.ceil(H*0.66/sp * g);
    for (let j = 0; j <= rows; j++){
      const y = H*0.80 - j*sp;
      if (y < H*0.14) break;
      ctx.beginPath(); ctx.moveTo(W*0.08, y); ctx.lineTo(W*0.92, y); ctx.stroke();
    }
  }
}

/* ---------- L3 标注 / 字幕 / 顶栏 ---------- */
function drawNotes(sc, t){
  for (const n of (sc.l3 || [])){
    const a = seg(t, n.t_in ?? sc.t_in, n.t_out ?? sc.t_out);
    if (a <= 0) continue;
    const color = n.color === 'accent' ? ACCENT : n.color === 'ink' ? INK : GRAY;
    const fam = n.mono ? 'Consolas, monospace' : '"Microsoft YaHei"';
    drawText(ctx, n.text, n.x*W, n.y*H, { font: `${n.font ?? 21}px ${fam}`, color, align: n.align ?? 'center', alpha: a, track: n.track ?? 0 });
  }
}
function drawSubtitles(t){
  for (const sb of (PLAN.subtitles || [])){
    const a = Math.min(seg(t, sb.t_in, sb.t_in + 0.3), 1 - seg(t, sb.t_out - 0.25, sb.t_out));
    if (a <= 0) continue;
    if (sb.punch){
      const pk = Math.sin(Math.PI * seg(t, sb.t_in + 0.25, sb.t_in + 0.61));
      const scale = 1 + 0.14 * pk;
      ctx.save();
      ctx.translate(W/2, 910);
      ctx.scale(scale, scale);
      drawText(ctx, sb.zh, 0, 16, { font: '700 46px "Microsoft YaHei"', color: INK, alpha: a });
      drawText(ctx, sb.en ?? '', 0, 64, { font: 'italic 27px Georgia', color: PAL.sub_en ?? '#9C9CB4', alpha: a*0.9 });
      ctx.restore();
    } else {
      drawText(ctx, sb.zh, W/2, 926, { font: '700 46px "Microsoft YaHei"', color: INK, alpha: a });
      drawText(ctx, sb.en ?? '', W/2, 974, { font: 'italic 27px Georgia', color: PAL.sub_en ?? '#9C9CB4', alpha: a*0.9 });
    }
  }
}
function drawTopbar(t){
  drawText(ctx, M.watermark ?? '', 64, 68, { font: '21px "Microsoft YaHei"', color: `rgba(${DIM},0.85)`, align: 'left', track: 4 });
  drawText(ctx, M.hook_title ?? M.topic, W/2, 68, { font: '21px "Microsoft YaHei"', color: `rgba(${ACCENT_DIM},0.9)`, track: 8 });
  const mm = String(Math.floor(t/60)).padStart(2, '0');
  const ss = String(Math.floor(t%60)).padStart(2, '0');
  const ff = String(Math.floor((t%1)*30)).padStart(2, '0');
  drawText(ctx, `${mm}:${ss}:${ff}`, W-64, 68, { font: '21px Consolas, monospace', color: `rgba(${DIM},0.7)`, align: 'right' });
}

/* ---------- blocks 积木（build_html.mjs 注入） ---------- */
/* entropy-burst — 粒子爆发积木（提炼自 demo-hook-entropy，QA 8.5/10）
 * params: {cx, cy, seed, count, t_birth:[a,b], t_burst, r_max, squash}
 * 确定性：粒子集合由 seed 派生，一次生成只读；无跨帧可变状态。 */
window.BLOCKS = window.BLOCKS || {};
window.BLOCKS['entropy-burst'] = {
  l2: (function () {
    const cache = new Map();
    function parts(seed, count) {
      const key = seed + ':' + count;
      if (cache.has(key)) return cache.get(key);
      let s = seed | 0;
      const rnd = () => {
        s = s + 0x6D2B79F5 | 0;
        let t = Math.imul(s ^ s >>> 15, 1 | s);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
      const arr = Array.from({ length: count }, () => {
        const ang = rnd() * Math.PI * 2;
        const spd = 0.06 + Math.pow(rnd(), 1.8) * 0.94;
        return { ang, spd, size: rnd() * 1.8 + 1.0, jitter: (rnd() - 0.5) * 0.5, ph: rnd() * Math.PI * 2 };
      });
      cache.set(key, arr);
      return arr;
    }
    return function (ctx, T, sc, P, U) {
      const CX = (P.cx ?? 0.42) * U.W, CY = (P.cy ?? 0.40) * U.H;
      const tBirth = P.t_birth || [0.05, 0.55];
      const tBurst = P.t_burst ?? 0.60;
      const rMax = P.r_max ?? 560;
      const squash = P.squash ?? 0.78;
      const born = U.easeOutBack(U.seg(T, tBirth[0], tBirth[1]));
      if (T < tBurst + 0.3) {
        ctx.save();
        ctx.shadowColor = U.ACCENT; ctx.shadowBlur = 42;
        ctx.fillStyle = U.ACCENT;
        ctx.beginPath(); ctx.arc(CX, CY, 7 * born, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      const p = U.seg(T, tBurst, sc.t_out);
      const rMain = U.easeOutCubic(U.clamp01(p * 1.9)) * rMax;
      const rSlow = rMax + U.easeOutCubic(U.clamp01(p * 0.55 - 0.45)) * (rMax * 0.32);
      const maxR = Math.max(rMain, rSlow);
      const alphaBase = 0.95 - 0.45 * p;
      for (const pt of parts(P.seed ?? 2026, P.count ?? 260)) {
        const wob = Math.sin(pt.ph + T * 2.2) * (pt.jitter * 22 + 8);
        const drift = U.easeOutCubic(U.clamp01(p * 0.4)) * 34 * pt.spd;
        const rr = Math.max(4, maxR * pt.spd + drift) + wob;
        const x = CX + Math.cos(pt.ang) * rr;
        const y = CY + Math.sin(pt.ang) * rr * squash;
        const a = alphaBase * (0.45 + 0.55 * (1 - rr / (rMax * 1.4)));
        if (a <= 0.02) continue;
        const tail = 7 + pt.spd * 11;
        ctx.strokeStyle = U.rgba(a * 0.72);
        ctx.lineWidth = pt.size * 0.9;
        ctx.beginPath();
        ctx.moveTo(CX + Math.cos(pt.ang) * (rr - tail), CY + Math.sin(pt.ang) * (rr - tail) * squash);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.fillStyle = U.rgba(a);
        ctx.beginPath(); ctx.arc(x, y, pt.size, 0, Math.PI * 2); ctx.fill();
        if (pt.size > 2.0) {
          ctx.fillStyle = `rgba(255,224,190,${a * 0.85})`;
          ctx.beginPath(); ctx.arc(x, y, pt.size * 0.55, 0, Math.PI * 2); ctx.fill();
        }
      }
    };
  })()
};


/* timeline — 年份轴积木（历史脉络/演化）
 * params: {cx, cy, w, area_pct, marks:[{year, label, t_in}], t_axis:[a,b]}
 * 视觉：水平轴线生长 → 刻度点逐个亮起 → 年份 mono + 事件标签上移淡入；
 * 轴线上 accent 粒子持续向右流动（持续运动源）。 */
window.BLOCKS = window.BLOCKS || {};
window.BLOCKS['timeline'] = {
  l2: function (ctx, T, sc, P, U) {
    const w = P.w ?? 1400;
    const cx = (P.cx ?? 0.42) * U.W, cy = (P.cy ?? 0.46) * U.H;
    const ta = P.t_axis || [0.4, 1.4];
    const marks = P.marks || [];
    const x0 = cx - w / 2, x1 = cx + w / 2;
    const ag = U.easeOutCubic(U.seg(T, ta[0], ta[1]));
    if (ag > 0) {
      ctx.strokeStyle = U.rgbaInk(0.4 * ag);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x0 + w * ag, cy); ctx.stroke();
    }
    const span = (marks.length > 1) ? (marks[marks.length - 1].year - marks[0].year) || 1 : 1;
    for (let i = 0; i < marks.length; i++) {
      const m = marks[i];
      const g = U.easeOutBack(U.seg(T, m.t_in ?? ta[1], (m.t_in ?? ta[1]) + 0.6));
      if (g <= 0) continue;
      const mx = x0 + w * ag * (m.year - marks[0].year) / span;
      const isAccent = i === marks.length - 1;
      const col = isAccent ? U.ACCENT : U.INK;
      ctx.fillStyle = col;
      ctx.globalAlpha = g;
      ctx.beginPath(); ctx.arc(mx, cy, (isAccent ? 9 : 6) * g, 0, Math.PI * 2); ctx.fill();
      if (isAccent) {
        /* 终点年持续呼吸环：强调焦点 + 持续运动源 */
        const pr = 9 + 4.5 * (0.5 + 0.5 * Math.sin(T * 4.0));
        ctx.strokeStyle = U.rgba(0.55);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(mx, cy, pr, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const rise = 14 * (1 - g);
      U.drawText(ctx, String(m.year), mx, cy - 46 - rise, { font: '36px Consolas, monospace', color: col, alpha: g });
      if (m.label) U.drawText(ctx, m.label, mx, cy + 52 - rise, { font: '21px "Microsoft YaHei"', color: U.GRAY, alpha: g });
    }
    if (T > ta[1]) {
      /* 粒子流：两股加粗提速（静止段治理：18×r2 太小测不出） */
      for (let i = 0; i < 30; i++) {
        const lane = (i % 2) * 10 - 5;
        const px = x0 + ((i * 173 + T * 95) % (w * ag));
        const pa = 0.45 + 0.4 * Math.sin(T * 7 + i * 2.1);
        if (pa <= 0.12) continue;
        ctx.fillStyle = U.rgba(pa);
        ctx.beginPath(); ctx.arc(px, cy + lane + 3 * Math.sin(T * 2 + i), 3, 0, Math.PI * 2); ctx.fill();
      }
      /* teal 扫掠游标：6s 一轮横扫整根轴，两端淡出（大运动源） */
      if (ag >= 1) {
        const sw = ((T - ta[1]) % 6) / 6;
        const sx = x0 + sw * w;
        const sa = Math.sin(Math.PI * sw);
        ctx.strokeStyle = U.rgba(0.5 * sa);
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx, cy - 64); ctx.lineTo(sx, cy + 64); ctx.stroke();
        ctx.fillStyle = U.rgba(0.85 * sa);
        ctx.beginPath();
        ctx.moveTo(sx, cy - 70); ctx.lineTo(sx - 6, cy - 82); ctx.lineTo(sx + 6, cy - 82);
        ctx.closePath(); ctx.fill();
      }
    }
  }
};


/* flow-pipe — 节点链管道积木（论文 Figure 1 式通信模型：源→发射机→信道→接收机→目的地）
 * params: {cx, cy, w, h, area_pct, nodes:[{label, sub}], node_w, node_h,
 *          t_nodes:[a,b] 节点逐个生长窗口, t_flow:[a,b] 粒子流动窗口}
 * 视觉：节点方块逐个生长（生长式进场）→ 链路连线 → accent 粒子沿链向右流动。
 * 粒子流动是持续运动源（QA 密度友好），节点标签 ink，sub 标注 gray。 */
window.BLOCKS = window.BLOCKS || {};
window.BLOCKS['flow-pipe'] = {
  l2: function (ctx, T, sc, P, U) {
    const w = P.w ?? 1500, h = P.h ?? 360;
    const cx = (P.cx ?? 0.42) * U.W, cy = (P.cy ?? 0.44) * U.H;
    const nodes = P.nodes || [];
    const n = Math.max(2, nodes.length);
    const tn = P.t_nodes || [0.4, 2.4];
    const x0 = cx - w / 2, x1 = cx + w / 2;
    const y0 = cy - h / 2, y1 = cy + h / 2;
    const nw = P.node_w ?? Math.min(170, w / n - 60);
    const nh = P.node_h ?? 120;
    const gap = (w - n * nw) / (n - 1);
    const centers = [];
    for (let i = 0; i < n; i++) centers.push(x0 + nw / 2 + i * (nw + gap));
    for (let i = 0; i < n; i++) {
      const g = U.easeOutBack(U.seg(T, tn[0] + (tn[1] - tn[0]) * i / n, tn[0] + (tn[1] - tn[0]) * (i + 0.6) / n));
      if (g <= 0) continue;
      const gx = centers[i], gy = (y0 + y1) / 2;
      ctx.save();
      ctx.translate(gx, gy);
      ctx.scale(g, g);
      const isAccent = i === Math.min(2, n - 1);
      ctx.fillStyle = isAccent ? U.rgba(0.10) : U.rgbaInk(0.05);
      ctx.strokeStyle = isAccent ? U.ACCENT : U.rgbaInk(0.45);
      ctx.lineWidth = 2;
      ctx.fillRect(-nw / 2, -nh / 2, nw, nh);
      ctx.strokeRect(-nw / 2, -nh / 2, nw, nh);
      ctx.restore();
      if (nodes[i] && nodes[i].label) {
        U.drawText(ctx, nodes[i].label, gx, gy - 8, { font: '24px "Microsoft YaHei"', color: U.INK, alpha: g });
      }
      if (nodes[i] && nodes[i].sub) {
        U.drawText(ctx, nodes[i].sub, gx, gy + nh / 2 + 34, { font: '20px "Microsoft YaHei"', color: U.GRAY, alpha: U.seg(T, tn[0] + (tn[1] - tn[0]) * i / n + 0.2, tn[0] + (tn[1] - tn[0]) * (i + 0.6) / n + 0.5) });
      }
    }
    for (let i = 0; i < n - 1; i++) {
      const g = U.easeOutCubic(U.seg(T, tn[0] + (tn[1] - tn[0]) * (i + 0.5) / n, tn[0] + (tn[1] - tn[0]) * (i + 1) / n));
      if (g <= 0) continue;
      const ax = centers[i] + nw / 2, bx = centers[i + 1] - nw / 2;
      const my = (y0 + y1) / 2;
      ctx.strokeStyle = U.rgbaInk(0.35 * g);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ax, my); ctx.lineTo(ax + (bx - ax) * g, my); ctx.stroke();
    }
    const tf = P.t_flow || [tn[1], sc.t_out];
    if (T >= tf[0]) {
      const per = 26;
      const speed = (x1 - x0) / 6.5;
      for (let i = 0; i < per; i++) {
        const seedPos = (i * 137 + Math.floor(T * speed * 30)) % (w + 200);
        const px = x0 - 100 + seedPos;
        const py = (y0 + y1) / 2 + 26 * Math.sin(i * 2.4 + T * 1.5);
        const pa = 0.30 + 0.30 * Math.sin(T * 8 + i * 1.9);
        if (pa <= 0.08) continue;
        ctx.fillStyle = U.rgba(pa);
        ctx.beginPath(); ctx.arc(px, py, 2.2 + (i % 3), 0, Math.PI * 2); ctx.fill();
      }
    }
  }
};


/* beat-counter — 大数字滚动 + 公式框积木（数字锚点/机制推演）
 * params: {cx, cy, font_px, to, decimals, prefix, suffix, expr,
 *          t_count:[a,b], t_expr:[a,b]}
 * 数字 = 唯一发光元素（计数期间），公式框描边用强调色。 */
window.BLOCKS = window.BLOCKS || {};
window.BLOCKS['beat-counter'] = {
  l2: function (ctx, T, sc, P, U) {
    const cx = (P.cx ?? 0.42) * U.W, cy = (P.cy ?? 0.42) * U.H;
    const fs = P.font_px ?? 200;
    const tc = P.t_count || [0.5, 3.0];
    const g = U.easeOutCubic(U.seg(T, tc[0], tc[1]));
    const val = (P.to ?? 37.8) * g;
    const txt = (P.prefix ?? '') + val.toFixed(P.decimals ?? 1) + (P.suffix ?? '');
    const glow = T >= tc[0] && T < tc[1] + 0.4;
    const pulse = T > tc[1] + 0.4 ? 1 + 0.035 * Math.sin((T - tc[1] - 0.4) * 3.7) : 1;
    if (glow) {
      ctx.save();
      ctx.shadowColor = U.ACCENT; ctx.shadowBlur = 30;
    }
    ctx.fillStyle = U.ACCENT;
    ctx.font = `700 ${fs}px Consolas, monospace`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    const w = ctx.measureText(txt).width;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    ctx.translate(-cx, -cy);
    ctx.fillText(txt, cx - w / 2, cy + fs * 0.35);
    ctx.restore();
    if (glow) ctx.restore();
    const te = P.t_expr || [tc[0] + 0.2, tc[0] + 1.0];
    const ea = U.seg(T, te[0], te[1]);
    if (ea > 0 && P.expr) {
      ctx.font = '44px Consolas, monospace';
      ctx.textAlign = 'left';
      const ew = ctx.measureText(P.expr).width;
      const ex = cx - ew / 2, ey = cy + fs * 0.35 + 96;
      ctx.globalAlpha = ea;
      ctx.fillStyle = 'rgba(234,234,242,0.92)';
      ctx.fillText(P.expr, ex, ey);
      ctx.strokeStyle = U.ACCENT;
      ctx.lineWidth = 2;
      ctx.strokeRect(ex - 24, ey - 44, ew + 48, 64);
      ctx.globalAlpha = 1;
    }
  }
};


/* text-points — 要点逐条点亮积木（机制步骤/三要点展开）
 * params: {cx, cy, w, area_pct, items:[{text, sub, t_in}], row_h, t_hold}
 * 视觉：每条 = accent 编号点（命中时亮起并持续脉冲）+ 主文 ink + 副行 gray；
 * 进场 = 点亮 + 文本上移淡入；未进场条不可见。
 * 持续运动源：进度下划线（点亮→场景尾持续填充）+ 编号点脉冲 + 巡游光带。
 * QA 教训（paper-shannon-deep 实测）：3px 细线怎么动都凑不够 0.35%/帧 的
 * 变化像素底线（~7.2k px/帧 @1080p）——细线没有面积。长场景尾部要靠
 * 大面积匀速平移的光带（110px 宽 accent 微光，两缘 ~10px/帧 ≈ 9.7k px/帧）。 */
window.BLOCKS = window.BLOCKS || {};
window.BLOCKS['text-points'] = {
  l2: function (ctx, T, sc, P, U) {
    const w = P.w ?? 1100;
    const cx = (P.cx ?? 0.42) * U.W, cy = (P.cy ?? 0.44) * U.H;
    const items = P.items || [];
    const rowH = P.row_h ?? 150;
    const x0 = cx - w / 2;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const tIn = it.t_in ?? (i * 1.2);
      const g = U.easeOutCubic(U.seg(T, tIn, tIn + 0.7));
      if (g <= 0) continue;
      const iy = cy - ((items.length - 1) * rowH) / 2 + i * rowH;
      const isActive = (it.t_out === undefined) || (T < it.t_out);
      const ph = T * 5.0 + i * 1.3;
      const dotR = 8 + 3.2 * Math.sin(ph);
      const dotA = 0.62 + 0.38 * Math.sin(ph + 0.9);
      const col = isActive ? U.ACCENT : U.GRAY;
      ctx.fillStyle = col;
      ctx.globalAlpha = g * Math.max(0.25, dotA);
      ctx.beginPath(); ctx.arc(x0 + 16, iy, Math.max(3, dotR * g), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      /* 进度下划线：从点亮到 t_out（默认场景尾）持续填充 */
      const iEnd = it.t_out ?? sc.t_out;
      const pg = U.clamp01((T - tIn) / Math.max(0.1, iEnd - tIn));
      if (pg > 0) {
        ctx.fillStyle = U.rgba(0.5 * g);
        ctx.fillRect(x0 + 44, iy + 54, (w - 70) * pg, 3);
      }
      ctx.save();
      ctx.translate(x0 + 44, iy + 8 * (1 - g));
      U.drawText(ctx, it.text, 0, 0, { font: '30px "Microsoft YaHei"', color: isActive ? U.INK : U.GRAY, align: 'left', alpha: g });
      if (it.sub) U.drawText(ctx, it.sub, 0, 40, { font: '21px "Microsoft YaHei"', color: U.GRAY, align: 'left', alpha: g * 0.9 });
      ctx.restore();
    }
    /* 巡游光带：accent 微光带横扫要点区（每 4s 一轮，两端 12% 行程内淡入淡出） */
    const bh = items.length * rowH;
    const t0 = items.length ? (items[0].t_in ?? 0) : 0;
    const swp = ((T - t0) % 4.0) / 4.0;
    const bA = 0.085 * Math.min(1, Math.min(swp, 1 - swp) / 0.12);
    if (bA > 0.004) {
      const sx = x0 - 60 + swp * (w + 120);
      ctx.fillStyle = U.rgba(bA);
      ctx.fillRect(sx, cy - bh / 2 - 14, 110, bh + 28);
    }
  }
};


/* data-chart — 双曲线分叉对比积木（自带生长式坐标轴，l1 可省）
 * params: {cx, cy, w, h, t_axes:[a,b], t_grow:[a,b],
 *          series: [{kind:'flat'|'exp', color:'ink'|'gray'|'accent', width>=2,
 *                    level(高 度比例), k(指数陡度), label, label_font}]}
 * 曲线末端在 grow>0.96 后出现端点 + 标签（ '?' 可作悬念钩子）。 */
window.BLOCKS = window.BLOCKS || {};
window.BLOCKS['data-chart'] = {
  l2: function (ctx, T, sc, P, U) {
    const w = P.w ?? 980, h = P.h ?? 560;
    const cx = (P.cx ?? 0.42) * U.W, cy = (P.cy ?? 0.46) * U.H;
    const x0 = cx - w / 2, y0 = cy + h / 2;
    const tAx = P.t_axes || [0.4, 1.2];
    const ag = U.easeOutCubic(U.seg(T, tAx[0], tAx[1]));
    if (ag > 0) {
      ctx.strokeStyle = U.rgbaInk(0.28 * ag);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + w * ag, y0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y0 - h * ag); ctx.stroke();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = U.rgbaInk(0.20 * ag);
      for (let i = 1; i <= 4; i++) {
        const gx = x0 + w * i / 4 * ag, gy = y0 - h * i / 4 * ag;
        ctx.beginPath(); ctx.moveTo(gx, y0 - 7); ctx.lineTo(gx, y0 + 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x0 - 7, gy); ctx.lineTo(x0 + 7, gy); ctx.stroke();
      }
    }
    const tg = P.t_grow || [0.6, 3.2];
    const g = U.easeOutCubic(U.seg(T, tg[0], tg[1]));
    if (g <= 0) return;
    for (const s of (P.series || [])) {
      const color = s.color === 'accent' ? U.ACCENT : (s.color === 'ink' ? U.INK : U.GRAY);
      const lw = s.width ?? 2.5;
      const n = 72;
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      let lx = 0, ly = 0, drawn = 0;
      for (let i = 0; i <= n; i++) {
        const q = i / n;
        if (q > g) break;
        const px = x0 + w * q;
        let py;
        if (s.kind === 'flat') py = y0 - h * (s.level ?? 0.14);
        else {
          const k = s.k ?? 5;
          py = y0 - h * 0.92 * (Math.exp(k * q) - 1) / (Math.exp(k) - 1);
        }
        if (drawn === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        lx = px; ly = py; drawn++;
      }
      ctx.stroke();
      if (s.color === 'accent'){
        const nP = 60;
        const expK = s.k ?? 5;
        for (let i = 0; i < nP; i++){
          const q = ((i / nP) + (T * 0.10) % 1) % 1;
          if (q > g) continue;
          const px = x0 + w * q;
          const py = y0 - h * 0.92 * (Math.exp(expK * q) - 1) / (Math.exp(expK) - 1);
          const pa = 0.75 * (0.45 + 0.55 * Math.sin(T * 6.0 + i * 2.4)) * (0.35 + 0.65 * q);
          if (pa <= 0.05) continue;
          ctx.fillStyle = U.rgba(pa);
          ctx.beginPath(); ctx.arc(px + 6 * Math.sin(T * 1.7 + i), py - 4 - 6 * ((i * 7 + Math.floor(T * 12)) % 5), 1.6 + (i % 3), 0, Math.PI * 2); ctx.fill();
        }
      }
      if (g > 0.96 && drawn > 0 && s.label) {
        const pulseR = s.color === 'accent'
          ? lw * 1.6 + 2 + 2.2 * Math.sin(T * 4.5)
          : lw * 1.6 + 2;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(lx, ly, Math.max(1.5, pulseR), 0, Math.PI * 2); ctx.fill();
        U.drawText(ctx, s.label, lx + 20, ly + 6,
          { font: `${s.label_font ?? 34}px Consolas, monospace`, color, align: 'left' });
      }
    }
    /* 巡游光带：accent 微光带横扫图区（每 4.2s 一轮，两端 12% 行程内淡入淡出）。
     * QA 教训（paper-shannon-deep 86-90s 实测 3.93s 静止）：曲线长完后回流粒子
     * 面积不够，需要大面积匀速平移的光带当持续运动源。 */
    {
      const tA = (P.t_axes ? P.t_axes[0] : 0.4);
      const swp = ((T - tA) % 4.2) / 4.2;
      const bA = 0.085 * Math.min(1, Math.min(swp, 1 - swp) / 0.12);
      if (bA > 0.004) {
        const sx = x0 - 50 + swp * (w + 100);
        ctx.fillStyle = U.rgba(bA);
        ctx.fillRect(sx, y0 - h - 16, 110, h + 30);
      }
    }
  }
};


/* vs-counters — 左右双数字对撞积木（双结局/反转落点）
 * params: {font_px, cy, t_count:[a,b], left:{cx,to,decimals,label,expr,t_label},
 *          right:{...同 left}}
 * 约定：右侧 = 强调色 + 发光（赢家），左侧 = 辅助灰。中缝竖线脉冲一次。 */
window.BLOCKS = window.BLOCKS || {};
window.BLOCKS['vs-counters'] = {
  l2: function (ctx, T, sc, P, U) {
    const fs = P.font_px ?? 150;
    const tc = P.t_count || [0.3, 1.6];
    const g = U.easeOutCubic(U.seg(T, tc[0], tc[1]));
    const items = [['left', P.left, false], ['right', P.right, true]];
    for (const [side, cfg, isAccent] of items) {
      if (!cfg) continue;
      const cx = (cfg.cx ?? (side === 'left' ? 0.31 : 0.69)) * U.W;
      const cy = (cfg.cy ?? (P.cy ?? 0.40)) * U.H;
      const val = (cfg.to ?? 1) * g;
      const txt = (cfg.prefix ?? '') + val.toFixed(cfg.decimals ?? 2) + (cfg.suffix ?? '');
      const color = isAccent ? U.ACCENT : U.GRAY;
      const isPulse = T > tc[1] + 0.4;
      const pulse = isPulse ? 1 + 0.035 * Math.sin((T - tc[1] - 0.4) * 3.7) : 1;
      if (isAccent && T >= tc[0] && T < tc[1] + 0.4) {
        ctx.save();
        ctx.shadowColor = U.ACCENT; ctx.shadowBlur = 26;
      }
      ctx.fillStyle = color;
      ctx.font = `700 ${fs}px Consolas, monospace`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      const w = ctx.measureText(txt).width;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(pulse, pulse);
      ctx.translate(-cx, -cy);
      ctx.fillText(txt, cx - w / 2, cy + fs * 0.35);
      ctx.restore();
      if (isAccent && T >= tc[0] && T < tc[1] + 0.4) ctx.restore();
      const tl = cfg.t_label ?? tc[0];
      const la = U.seg(T, tl, tl + 0.8);
      if (la > 0) {
        if (cfg.label) U.drawText(ctx, cfg.label, cx, cy - fs * 0.62,
          { font: '25px "Microsoft YaHei"', color: U.GRAY, alpha: la });
        if (cfg.expr) U.drawText(ctx, cfg.expr, cx, cy + fs * 0.35 + 64,
          { font: '36px Consolas, monospace', color: isAccent ? U.ACCENT : U.GRAY, alpha: la });
      }
    }
    if (P.divider === true) {
      const va = U.seg(T, tc[0] - 0.1, tc[0] + 0.5);
      if (va > 0 && va < 1) {
        ctx.strokeStyle = U.rgbaInk(0.3 * (1 - Math.abs(2 * va - 1)));
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(U.W * 0.5, U.H * 0.26);
        ctx.lineTo(U.W * 0.5, U.H * 0.58);
        ctx.stroke();
      }
    }
  }
};


/* ---------- 合成 ---------- */
function sceneAt(t){
  for (const sc of PLAN.scenes){
    if (t >= sc.t_in - 1e-6 && t < sc.t_out + 1e-6) return sc;
  }
  return t >= M.duration ? PLAN.scenes[PLAN.scenes.length-1] : PLAN.scenes[0];
}
window.render = function(t){
  ctx.clearRect(0, 0, W, H);
  drawL0(t);
  const sc = sceneAt(t) || PLAN.scenes[0];
  const P = (sc.l2 && sc.l2.params) || {};
  const B = (sc.l2 && window.BLOCKS) ? window.BLOCKS[sc.l2.block] : null;
  if (sc.l1 && sc.l1.grow) drawBuiltinL1(sc.l1, sc, t);
  if (B && B.l1) B.l1(ctx, t, sc, P, U);
  if (B && B.l2) B.l2(ctx, t, sc, P, U);
  vignette();
  drawNotes(sc, t);
  drawSubtitles(t);
  drawTopbar(t);
};

/* ---------- 抓帧模式 / 预览 ---------- */
window.DUR = M.duration;
window.READY = false;
if (new URLSearchParams(location.search).has('t')){
  const t = parseFloat(new URLSearchParams(location.search).get('t'));
  document.fonts.ready.then(() => { window.render(t); window.READY = true; });
} else {
  document.fonts.ready.then(() => { window.READY = true; });
  const t0 = performance.now();
  (function loop(now){ window.render(((now || performance.now()) - t0) / 1000 % window.DUR); requestAnimationFrame(loop); })();
}
</script>
</body>
