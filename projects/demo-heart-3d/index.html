<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>真 3D 心形 · 8s（软件渲染：透视 + Blinn-Phong + 连续旋转）</title>
<style>
  html,body{margin:0;padding:0;background:#08030A;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================================
 * 真 3D 爱心钩子 · 8s · 1920x1080 @30fps
 * 与 demo-heart（2.5D）的区别：这里是一张**真三维网格**——
 *   心形轮廓 → 前后双面 + 圆角侧壁的挤出体，逐三角形做
 *   透视投影 + Blinn-Phong 光照（方向光/镜面高光/边缘光）+ 背面剔除 +
 *   painter's algorithm 深度排序，**连续 rotateY 摆动 + 心跳体积脉动**。
 *   不是贴图假 3D，也没有引入 Three.js（零依赖单文件哲学不变；
 *   网格 ~600 三角形，Canvas 2D 每帧 <10ms，渲染速度与 2D 场景相同）。
 * 叙事：0.3s 光点起 → 心体从无到有长大（真 3D 缩放）→ 材质点亮 →
 *   ECG 扫描 + 隐式方程显影 → 连续旋转中 punch 收尾。
 * 构图：四层骨架；心中心 x=0.435，公式框右侧 0.60–0.78 第二视觉。
 * 契约：render(t) 纯时间函数；?t= 抓帧模式；固定种子；无跨帧状态。
 * ===================================================================== */
const W = 1920, H = 1080;
const DUR = 8;
const ACCENT = '#FF5C86';
const ACCENT_DIM = '255,92,134';
const INK = '#F2E8EC', GRAY = '#A08898';
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

/* ---------- 工具 ---------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeOutBack  = p => { const c = 1.70158 * 0.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function seg(t, a, b){ return clamp01((t - a) / (b - a)); }

function drawText(text, x, y, opt){
  const o = Object.assign({ font: '28px "Microsoft YaHei"', color: INK, align: 'center', maxW: W, alpha: 1, track: 0 }, opt);
  ctx.font = o.font; ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = o.alpha;
  const fs = parseFloat((o.font.match(/([\d.]+)px/) || [0, 28])[1]);
  const lines = []; let cur = '';
  const measure = s => ctx.measureText(s).width + s.length * o.track;
  for (const ch of text){
    if (measure(cur + ch) > o.maxW * 0.82 && cur){ lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  lines.forEach((ln, i) => {
    const w = measure(ln);
    let sx = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
    for (const ch of ln){
      ctx.fillStyle = o.color; ctx.fillText(ch, sx, y + i * (fs * 1.32));
      sx += ctx.measureText(ch).width + o.track;
    }
  });
  ctx.globalAlpha = 1;
  return lines.length;
}

/* ---------- 3D 基础 ---------- */
const FOV = 3.4;                       // 相机焦距（模型单位）
const CAMZ = 0;                        // 相机在 z=0 平面外看 +z 朝自己
function project(p){
  // p = [x,y,z]，z+ 朝观察者。透视：scale = FOV/(FOV - z)
  const s = FOV / (FOV - p[2]);
  return [p[0] * s, p[1] * s, p[2], s];
}
function rotY(p, a){ const c = Math.cos(a), s = Math.sin(a); return [p[0]*c + p[2]*s, p[1], -p[0]*s + p[2]*c]; }
function rotX(p, a){ const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1]*c - p[2]*s, p[1]*s + p[2]*c]; }

/* 光照：方向光（左上前）+ ambient + Blinn-Phong 高光 + rim 边缘光 */
const L = (() => { const v = [-0.45, 0.62, 0.64]; const m = Math.hypot(...v); return v.map(x => x / m); })();
const VIEW = [0, 0, 1];
function shade(nx, ny, nz, base, amb, bright){
  const m = Math.hypot(nx, ny, nz); nx /= m; ny /= m; nz /= m;
  if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }        // 双面照亮（后面用镜像法线）
  const diff = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
  const h = [(L[0] + VIEW[0]) , (L[1] + VIEW[1]), (L[2] + VIEW[2])];
  const hm = Math.hypot(...h);
  const spec = Math.pow(Math.max(0, (nx*h[0] + ny*h[1] + nz*h[2]) / hm), 26) * 0.55;
  const rim  = Math.pow(1 - Math.abs(nz), 2.2) * 0.38;
  const k = amb + diff * 0.72;
  const r = Math.min(255, base[0] * k + spec * 235 + rim * 255 * 0.55);
  const g = Math.min(255, base[1] * k + spec * 215 + rim * 150 * 0.55);
  const b = Math.min(255, base[2] * k + spec * 225 + rim * 175 * 0.55);
  return [r * bright, g * bright, b * bright];
}
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

/* ---------- 3D 心形网格：轮廓 → (中心点, 内环, 边缘环) × 前后面 + 侧壁 ---------- */
const RING_N = 160;
const HEART_CX = W * 0.435, HEART_CY = H * 0.42;   // 心中心（偏左 6.5%，垂直略降避开顶栏）
const HEART_SCL = 330;                              // 心宽 ≈ 620px（占宽 32%），底尖 y≈784 < 800
const OUTLINE = [];                     // 归一化心形轮廓（半径 ~1）
for (let i = 0; i < RING_N; i++){
  const th = (i / RING_N) * Math.PI * 2;
  const x = 16 * Math.pow(Math.sin(th), 3) / 17;
  const y = (13 * Math.cos(th) - 5 * Math.cos(2*th) - 2 * Math.cos(3*th) - Math.cos(4*th)) / 17;
  OUTLINE.push([x, -y]);               // 屏幕 y 向下，预翻转
}
// 轮廓外法线（2D）：切线旋转 90°，指向外侧
const NORMALS = (() => {
  const out = [];
  for (let i = 0; i < RING_N; i++){
    const a = OUTLINE[(i + 1) % RING_N], b = OUTLINE[(i - 1 + RING_N) % RING_N];
    let tx = a[0] - b[0], ty = a[1] - b[1];
    const m = Math.hypot(tx, ty); tx /= m; ty /= m;
    let nx = ty, ny = -tx;             // 顺时针轮廓的外法线
    // 校正朝外：与 (点-质心) 同向
    const cx = OUTLINE[i][0], cy = OUTLINE[i][1];
    if (nx * cx + ny * cy < 0){ nx = -nx; ny = -ny; }
    out.push([nx, ny]);
  }
  return out;
})();
const Z_FACE = 0.34, Z_MID = 0.27, IN_SCL = 0.86, MID_SCL = 0.97;
const BASE = [255, 92, 134];           // 玫红

// 顶点表：前中心/前内环/前中环/前缘环，后同理（z 取负）
function heartVert(t){
  const beat = heartbeat(t);
  const scl = beat * growScale(t) * 1.28;   // 模型尺度（占屏约 1/3 宽）
  const ry = -0.18 + Math.sin(t * 0.85) * 0.5;   // 连续 rotateY 摆动（±28.6°）
  const rx = -0.10 + Math.sin(t * 0.6) * 0.03;   // 微俯视 + 呼吸
  const V = [];
  const push = (pt, ring) => {
    const v = [pt[0] * scl, pt[1] * scl, pt[2] * scl];
    let w = rotY(v, ry); w = rotX(w, rx);
    return w;
  };
  const fC = push([0, 0.02, Z_FACE]),      bC = push([0, 0.02, -Z_FACE]);
  const fI = [], fM = [], fO = [], bI = [], bM = [], bO = [];
  for (let i = 0; i < RING_N; i++){
    const o = OUTLINE[i], n = NORMALS[i];
    fI.push(push([o[0]*IN_SCL + n[0]*0.012, o[1]*IN_SCL + n[1]*0.012, Z_MID]));
    fM.push(push([o[0]*MID_SCL, o[1]*MID_SCL, Z_FACE*0.88]));
    fO.push(push([o[0], o[1], 0]));
    bI.push(push([o[0]*IN_SCL - n[0]*0.012, o[1]*IN_SCL - n[1]*0.012, -Z_MID]));
    bM.push(push([o[0]*MID_SCL, o[1]*MID_SCL, -Z_FACE*0.88]));
    bO.push(push([o[0], o[1], 0]));
  }
  return { fC, bC, fI, fM, fO, bI, bM, bO, scl };
}
// tri 收集：顶点(3D) + 面法线(用世界法线近似：挤出体旋转后法线也旋转)
function trisOf(t){
  const V = heartVert(t);
  const ry = -0.18 + Math.sin(t * 0.85) * 0.5;
  const rx = -0.10 + Math.sin(t * 0.6) * 0.03;
  const rotN = (n) => { let w = rotY(n, ry); return rotX(w, rx); };
  const tris = [];
  const add = (a, b, c, n, base, amb) => tris.push({ a, b, c, n: rotN(n), base, amb });
  for (let i = 0; i < RING_N; i++){
    const j = (i + 1) % RING_N;
    const n2d = [NORMALS[i][0] + NORMALS[j][0], NORMALS[i][1] + NORMALS[j][1], 0];
    // 前面：中心扇（z+ 面，法线 (0,0,1) 附近）
    add(V.fC, V.fI[j], V.fI[i], [0, 0, 1], BASE, 0.34);
    add(V.fC, V.fI[i], V.fI[j], [0, 0, 1], BASE, 0.34);
    // 前斜面（内环→中环）：法线 = 外法线 + z 分量
    add(V.fI[i], V.fM[j], V.fM[i], [n2d[0]*0.4, n2d[1]*0.4, 0.82], BASE, 0.30);
    add(V.fI[i], V.fI[j], V.fM[j], [n2d[0]*0.4, n2d[1]*0.4, 0.82], BASE, 0.30);
    // 中环→缘环（接近侧面）
    add(V.fM[i], V.fO[j], V.fO[i], [n2d[0]*0.75, n2d[1]*0.75, 0.5], BASE, 0.26);
    add(V.fM[i], V.fM[j], V.fO[j], [n2d[0]*0.75, n2d[1]*0.75, 0.5], BASE, 0.26);
    // 侧壁（缘环 z=0 挤到 -Z_FACE*0.88……侧壁连前后缘环）
    add(V.fO[i], V.bO[j], V.bO[i], [n2d[0], n2d[1], 0], [196, 46, 92], 0.22);
    add(V.fO[i], V.fO[j], V.bO[j], [n2d[0], n2d[1], 0], [196, 46, 92], 0.22);
    // 后面斜面 + 后扇（法线取反）
    add(V.bI[i], V.bM[i], V.bM[j], [-n2d[0]*0.4, -n2d[1]*0.4, -0.82], [172, 34, 80], 0.18);
    add(V.bI[i], V.bM[j], V.bI[j], [-n2d[0]*0.4, -n2d[1]*0.4, -0.82], [172, 34, 80], 0.18);
    add(V.bC, V.bI[i], V.bI[j], [0, 0, -1], [172, 34, 80], 0.16);
  }
  return { V, tris };
}

/* ---------- 心跳 / 生长 ---------- */
function heartbeat(t){
  const u = (t % 1.1) / 1.1;
  const p1 = Math.exp(-Math.pow((u - 0.10) / 0.06, 2));
  const p2 = 0.55 * Math.exp(-Math.pow((u - 0.28) / 0.09, 2));
  return 1 + 0.052 * (p1 + p2) * seg(t, 1.6, 2.2);
}
function growScale(t){ return easeOutBack(seg(t, 0.30, 1.75)); }

/* ---------- 绘制 3D 心 ---------- */
function drawHeart3D(t){
  const gs = growScale(t);
  const CX = HEART_CX, CY = HEART_CY;
  const SCL = HEART_SCL;

  if (gs <= 0){
    // 0–0.3s：起笔光点 = 心顶凹点（OUTLINE[0]）处的唯一发光元素
    const b = easeOutBack(seg(t, 0.03, 0.28));
    const v = [OUTLINE[0][0] * 1.28, OUTLINE[0][1] * 1.28, 0];
    const s = FOV / (FOV - v[2]);
    ctx.save();
    ctx.shadowColor = ACCENT; ctx.shadowBlur = 44;
    ctx.fillStyle = ACCENT;
    ctx.beginPath(); ctx.arc(CX + v[0] * SCL * s, CY + v[1] * SCL * s, 8 * b, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }
  const amb = 0.16 + 0.20 * seg(t, 1.4, 2.6);        // 材质点亮：环境光渐强
  const bright = 0.55 + 0.45 * seg(t, 1.2, 2.4);
  const { V, tris } = trisOf(t);
  const cache = new Map();
  function proj(v){
    const key = (v[0].toFixed(4)) + '|' + (v[1].toFixed(4)) + '|' + (v[2].toFixed(4));
    let hit = cache.get(key);
    if (!hit){
      const s = FOV / (FOV - v[2]);
      hit = [CX + v[0] * SCL * s, CY + v[1] * SCL * s];
      cache.set(key, hit);
    }
    return hit;
  }
  // painter's algorithm：按相机空间 z 均值升序（远的先画）
  const items = tris.map(tri => {
    const z = (tri.a[2] + tri.b[2] + tri.c[2]) / 3;
    return { tri, z };
  }).sort((p, q) => p.z - q.z);
  for (const { tri } of items){
    if (tri.n[2] < 0 && Math.abs(tri.n[2]) > 0.55) continue;   // 背面强剔除（斜面保留）
    const col = shade(tri.n[0], tri.n[1], tri.n[2], tri.base, tri.amb, bright);
    const A = proj(tri.a), B = proj(tri.b), C = proj(tri.c);
    ctx.fillStyle = rgb(col);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.lineTo(C[0], C[1]); ctx.closePath(); ctx.fill();
  }
  // 边缘辉光：心形轮廓投影线（缘环连成线，玫红 2.4px）——"活体边缘"
  ctx.strokeStyle = `rgba(${ACCENT_DIM},${0.5 * bright})`;
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i <= RING_N; i++){
    const p = proj(V.fO[i % RING_N]);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
}

/* ---------- L0 氛围层 ---------- */
const GRAIN = (() => { const r = mulberry32(20261106); return Array.from({length: 900}, () => [r()*W, r()*H, r()*0.028+0.012]); })();
const DUST  = (() => { const r = mulberry32(99);  return Array.from({length: 190}, () => [r()*W, r()*H, r()*0.30+0.10, r()*1.7+0.5, r()*Math.PI*2]); })();
function drawL0(t){
  const g = ctx.createRadialGradient(W*0.435, H*0.38, 90, W*0.435, H*0.38, 1150);
  g.addColorStop(0, '#2A0E1E'); g.addColorStop(0.55, '#17060F'); g.addColorStop(1, '#08030A');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const drift = (t / DUR) * 8;
  DUST.forEach(([x, y, a, s, ph]) => {
    const tw = 0.72 + 0.28 * Math.sin(t * 1.6 + ph);
    ctx.fillStyle = `rgba(255,190,205,${a * tw})`;
    ctx.fillRect(x, (y - drift + H) % H, s, s);
  });
  for (const [x, y, a] of GRAIN){ ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(x, y, 1.5, 1.5); }
}
function vignette(){
  const v = ctx.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, H*0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ---------- L1 支撑层：回声轮廓（真 3D 投影线）+ 刻度弧 ---------- */
function drawL1(t){
  const g = easeOutCubic(seg(t, 2.35, 3.45));
  if (g <= 0) return;
  const ry = -0.18 + Math.sin(t * 0.85) * 0.5, rx = -0.10;
  const scl = 1.28 * heartbeat(t);
  [0.78, 0.6, 0.42].forEach((sc, i) => {
    ctx.strokeStyle = `rgba(${ACCENT_DIM},${(0.12 - i * 0.035) * g})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    const N = 90;
    for (let k = 0; k <= N; k++){
      const idx = Math.floor(k / N * RING_N) % RING_N;
      const o = OUTLINE[idx];
      let v = [o[0]*sc, o[1]*sc, 0.05 * Math.sin(k / N * Math.PI * 2 + t)];
      v = rotX(rotY([v[0]*scl, v[1]*scl, v[2]*scl], ry), rx);
      const s = FOV / (FOV - v[2]);
      const px = HEART_CX + v[0] * HEART_SCL * s, py = HEART_CY + v[1] * HEART_SCL * s;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();
  });
}

/* ---------- L2-b：ECG 心电扫描 ---------- */
function ecgY(u){
  const g = (c, w, h) => h * Math.exp(-Math.pow((u - c) / w, 2));
  return g(0.16, 0.030, -12) + g(0.30, 0.010, 52) - g(0.335, 0.014, -16) + g(0.37, 0.012, 20) + g(0.55, 0.045, 16);
}
function drawECG(t){
  const start = seg(t, 2.55, 2.95);
  if (start <= 0) return;
  const x0 = W * 0.08, x1 = W * 0.92, y0 = H * 0.72;
  const sweep = easeOutCubic(seg(t, 2.6, 6.2));
  ctx.strokeStyle = `rgba(${ACCENT_DIM},${0.22 * start})`;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + (x1 - x0) * sweep, y0); ctx.stroke();
  ctx.strokeStyle = `rgba(${ACCENT_DIM},${0.62 * start})`;
  ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
  ctx.beginPath();
  const N = 260;
  for (let i = 0; i <= N * sweep; i++){
    const u = i / N;
    const x = x0 + (x1 - x0) * u;
    const y = y0 - ecgY((u * 3) % 1) * seg(t, 2.6, 2.9);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  if (sweep < 1){
    const hx = x0 + (x1 - x0) * sweep;
    const hy = y0 - ecgY((sweep * 3) % 1) * seg(t, 2.6, 2.9);
    ctx.fillStyle = `rgba(255,179,200,${0.9 * start})`;
    ctx.beginPath(); ctx.arc(hx, hy, 3.2, 0, Math.PI * 2); ctx.fill();
  }
  drawText('ECG · 心电', x0, y0 + 44, { font: '20px Consolas, monospace', color: GRAY, align: 'left', alpha: seg(t, 5.6, 6.4) * 0.9 });
}

/* ---------- L3 标注层 ---------- */
function drawL3(t){
  drawText('TRUE-3D · 真三维渲染', W*0.435 - 165, H*0.40 - 330, { font: '21px "Microsoft YaHei"', color: GRAY, align: 'right', alpha: seg(t, 1.5, 2.3), track: 6 });
  const fa = seg(t, 3.15, 4.05);
  if (fa > 0){
    ctx.save();
    ctx.font = '52px Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    const eq = '(x²+y²−1)³ − x²y³ = 0';
    const fw = ctx.measureText(eq).width;
    const fx = W * 0.70 - fw / 2, fy = HEART_CY + 6;
    ctx.globalAlpha = fa;
    ctx.fillStyle = 'rgba(242,232,236,0.93)';
    ctx.fillText(eq, fx, fy);
    ctx.strokeStyle = ACCENT; ctx.lineWidth = 2;
    ctx.strokeRect(fx - 26, fy - 52, fw + 52, 82);
    ctx.globalAlpha = 1;
    ctx.restore();
    drawText('每一点都在真实光照里', W * 0.70, HEART_CY + 62, { font: '22px "Microsoft YaHei"', color: `rgba(160,136,152,${fa})`, align: 'center' });
  }
}

/* ---------- 字幕带 ---------- */
function drawSubtitle(t){
  const a1 = Math.min(seg(t, 0.90, 1.25), 1 - seg(t, 4.15, 4.45));
  if (a1 > 0){
    drawText('数学家是怎么画爱心的？', W / 2, 926, { font: '700 46px "Microsoft YaHei"', color: INK, alpha: a1 });
    drawText('How does a mathematician draw a heart?', W / 2, 974, { font: 'italic 27px Georgia', color: '#B49CA8', alpha: a1 * 0.9 });
  }
  const a2 = seg(t, 6.50, 6.80);
  if (a2 > 0){
    const pk = t < 7.16 ? Math.sin(Math.PI * seg(t, 6.80, 7.16)) : 0;
    const scale = 1 + 0.14 * pk;
    ctx.save();
    ctx.translate(W / 2, 910);
    ctx.scale(scale, scale);
    drawText('一条曲线，就够了。', 0, 16, { font: '700 46px "Microsoft YaHei"', color: INK, alpha: a2 });
    drawText('One curve is all it takes.', 0, 64, { font: 'italic 27px Georgia', color: '#B49CA8', alpha: a2 * 0.9 });
    ctx.restore();
  }
}

/* ---------- 顶栏 ---------- */
function drawTopbar(t){
  drawText('@VIBE·DSF', 64, 68, { font: '21px "Microsoft YaHei"', color: 'rgba(160,136,152,0.85)', align: 'left', track: 4 });
  drawText('心形曲线 · TRUE 3D', W / 2, 68, { font: '21px "Microsoft YaHei"', color: `rgba(255,92,134,0.9)`, track: 8 });
  const mm = String(Math.floor(t / 60)).padStart(2, '0');
  const ss = String(Math.floor(t % 60)).padStart(2, '0');
  const ff = String(Math.floor((t % 1) * 30)).padStart(2, '0');
  drawText(`${mm}:${ss}:${ff}`, W - 64, 68, { font: '21px Consolas, monospace', color: 'rgba(160,136,152,0.7)', align: 'right' });
}

/* ---------- 合成 ---------- */
window.render = function(t){
  ctx.clearRect(0, 0, W, H);
  drawL0(t);
  drawL1(t);
  drawHeart3D(t);
  drawECG(t);
  vignette();
  drawL3(t);
  drawSubtitle(t);
  drawTopbar(t);
};

/* ---------- 抓帧模式 / 预览 ---------- */
window.DUR = DUR;
window.READY = false;
if (new URLSearchParams(location.search).has('t')){
  const t = parseFloat(new URLSearchParams(location.search).get('t'));
  document.fonts.ready.then(() => { window.render(t); window.READY = true; });
} else {
  document.fonts.ready.then(() => { window.READY = true; });
  const t0 = performance.now();
  (function loop(now){ window.render(((now || performance.now()) - t0) / 1000 % DUR); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
