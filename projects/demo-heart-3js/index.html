<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全息投影台 · 悬浮玻璃心（Three.js r146）</title>
<style>
  html,body{margin:0;padding:0;background:#08030A;overflow:hidden}
  canvas{display:block;position:absolute;inset:0}
  #ui{z-index:2}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<script src="../../vendor/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   全息投影台 · 悬浮玻璃心 — Three.js r146 UMD 自包含单文件（规范 v1.2）
   ─────────────────────────────────────────────────────────────────
   概念：台面发光心形曲线（锚，0.32–2.0s 描线，1.6s 后仅描尾）→
         锥形光束 → Taubin 隐式体心透明外壳（1.6–2.6s 三通道
         easeOutCubic 入场：底尖 902px→714px 浮起 / scale 0.6→1 /
         各层 opacity×g(t)，无 overshoot），2.2s 起心跳。
   渲染契约：
   · window.render(t) 为纯时间函数，同 t 逐像素一致
   · ?t=<秒> 抓帧模式：fonts.ready 后单帧渲染并置 READY
   · 无跨帧状态（无 +=delta / 无逐帧 random / 无 Date.now 驱动）
   · 全部几何启动期一次性构建（Taubin 固定 24 次二分 + TubeGeometry）
   · 结构防呆（v1.1 条款2）：外壳 + 1.03× 菲涅尔 + 内骨 + 背衬光晕
     同挂 heartGroup，动画只写 Group 根 scale/position，g(t) 统一乘
     各子层材质基础 opacity——克隆层与主体结构上不可能错帧
   · pulse(t) 七处同步；描线期（t<2.2）钳 0；第 6 跳 ×1.15 后 0.3s
     线性衰减回常驻基线
   · 坐标标定：f≈1568px，z=0 平面 1wu≈25.3px；心中心 (845,454)px
   ═══════════════════════════════════════════════════════════════════ */
const W = 1920, H = 1080;
const DUR = 8;
const ACCENT = '#FF5C86';
const INK = '#FFF0F5', GRAY = '#A08898';
/* 心中心像素锚点 (845, 454) = (0.44W, 0.42H) */
const CX = 845, CY = 454;

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
function seg(t, a, b){ return clamp01((t - a) / (b - a)); }

/* 心跳 pulse（D7 + v1.1 条款5）：周期 1.1s、主相位 t0=2.2、双高斯 lub-dub；
   第 6 搏 ×1.15，其增益在 7.7s 后 0.3s 内线性衰减回常驻基线；描线期钳 0 */
function pulse(t){
  if (t < 2.2) return 0;
  const bt = t - 2.2;
  const idx = Math.floor(bt / 1.1);
  const u = (bt - idx * 1.1) / 1.1;
  let p = Math.exp(-(u * u) / (0.12 * 0.12))
        + 0.55 * Math.exp(-((u - 0.25) * (u - 0.25)) / (0.10 * 0.10));
  if (idx === 5){
    const dt6 = bt - 5 * 1.1;                       /* 距 7.7s 峰值的时移 */
    p *= 1 + 0.15 * Math.max(0, 1 - dt6 / 0.3);     /* ×1.15 → 0.3s 线性衰减至 ×1.0 */
  }
  return p;
}

/* 心体入场（v1.1 条款1）：三通道同步 easeOutCubic，无任何 back 例外
   g(t) 同时驱动：底尖浮起（屏 902px→714px，行程 188px≈7.4wu）、
   scale 0.6→1、各层基础 opacity（外壳 0.42 / 菲涅尔 / 内骨 / 光晕） */
function entrance(t){ return easeOutCubic(seg(t, 1.6, 2.6)); }

function drawText(text, x, y, opt){
  const o = Object.assign({ font: '28px "Microsoft YaHei"', color: INK, align: 'center', maxW: W, alpha: 1, track: 0, stroke: null, strokeW: 1 }, opt);
  const c = o.ctx || ctx2;
  c.font = o.font; c.textBaseline = 'alphabetic'; c.globalAlpha = o.alpha;
  const fs = parseFloat((o.font.match(/([\d.]+)px/) || [0, 28])[1]);
  const lines = []; let cur = '';
  const measure = s => c.measureText(s).width + s.length * o.track;
  for (const ch of text){
    if (measure(cur + ch) > o.maxW * 0.82 && cur){ lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  lines.forEach((ln, i) => {
    const w = measure(ln);
    let sx = o.align === 'left' ? x : o.align === 'right' ? x - w : x - w / 2;
    const yy = y + i * (fs * 1.32);
    for (const ch of ln){
      if (o.stroke){ c.strokeStyle = o.stroke; c.lineWidth = o.strokeW; c.strokeText(ch, sx, yy); }
      c.fillStyle = o.color; c.fillText(ch, sx, yy);
      sx += c.measureText(ch).width + o.track;
    }
  });
  c.globalAlpha = 1;
  return lines.length;
}

/* ═══ Three.js 3D 层 ═══ */
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('gl'),
  antialias: true, alpha: false, preserveDrawingBuffer: true
});
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
const bgCv = document.createElement('canvas'); bgCv.width = 512; bgCv.height = 512;
{
  const c = bgCv.getContext('2d');
  const g = c.createRadialGradient(256*0.48, 256*0.42, 30, 256*0.48, 256*0.42, 300);
  g.addColorStop(0, '#2A0E1E'); g.addColorStop(0.55, '#17060F'); g.addColorStop(1, '#08030A');
  c.fillStyle = g; c.fillRect(0, 0, 512, 512);
}
scene.background = new THREE.CanvasTexture(bgCv);

const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 200);
camera.position.set(0, 1.2, 62);
camera.lookAt(0, 0, 0);

/* ── 世界坐标布局（针孔投影反推标定，f≈1568px）──
   心中心 (HX,HY,0) → 屏幕 (845,454)；心体 19.76×20.55wu → 500×520px
   心底尖目标 y=714px → 世界 -5.675wu；入场起点底尖 y=902px → 世界 -13.11wu
   台面 y=FY=-22；曲线组世界 z=FZ=-20；盘心 (DX,FY,DISC_Z=-23.3) → 屏幕 (845,967)
   盘直径 0.40W=768px（v1.1 条款4）→ 盘心深度处半径 20.9wu */
const HX = -4.54, HY = 4.6, HW = 19.76, HH = 20.55;
const APEX_Y0 = -13.11, APEX_Y1 = HY - HH / 2;   /* 底尖起止世界 y */
const DX = -6.25, FY = -22, FZ = -20, DISC_Z = -23.3, DISC_R = 20.9;
const FS = 1.05, ZS = 0.45;      /* 底部曲线缩放 / 纵深压扁 */

/* ── 布光（视觉定案：key 0.85 / fill 0.45 / rim 1.15 呼吸 / hemi 0.44 / 底部点光）── */
const keyLight = new THREE.DirectionalLight(0xfff0ea, 0.85);  keyLight.position.set(-18, 24, 30);
const fillLight = new THREE.DirectionalLight(0xff9db8, 0.45); fillLight.position.set(22, -14, 18);
const rimLight = new THREE.DirectionalLight(0xffffff, 1.15);  rimLight.position.set(4, 16, -30);
const hemi = new THREE.HemisphereLight(0x5a2440, 0x0a0510, 0.44);
const bottomLight = new THREE.PointLight(0xff4d7e, 1.6, 12);  /* 曲线盘上方 2wu */
bottomLight.position.set(DX, FY + 2, DISC_Z);
scene.add(keyLight, fillLight, rimLight, hemi, bottomLight);

/* ── 接触阴影：移至盘下方，更浅更弥散（opacity 0.35×g）── */
const shCv = document.createElement('canvas'); shCv.width = 256; shCv.height = 128;
{
  const c = shCv.getContext('2d');
  const g = c.createRadialGradient(128, 64, 8, 128, 64, 120);
  g.addColorStop(0, 'rgba(150,20,60,0.40)'); g.addColorStop(1, 'rgba(150,20,60,0)');
  c.scale(1, 0.5); c.fillStyle = g; c.fillRect(0, 0, 256, 256);
}
const shadowMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shCv), transparent: true, depthWrite: false, opacity: 0 });
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(48, 48), shadowMat);
shadow.rotation.x = -Math.PI / 2;
shadow.position.set(DX, FY - 0.5, DISC_Z);
shadow.renderOrder = 0;
scene.add(shadow);

/* ── Taubin 隐式体心（D6）：z 为竖直轴，three(x,y,z)=taubin(x,z,y)；
       每方向固定 24 次二分求半径场，构建结果与帧无关 ── */
function taubinF(x, y, z){ /* taubin 轴系：z 竖直（心尖 -z / 凹口 +z） */
  const q = x * x + 2.25 * y * y + z * z - 1;
  return q * q * q - z * z * z * (x * x + 2.25 * y * y);
}
const heartGeo = new THREE.SphereGeometry(1, 96, 64);
{
  const pos = heartGeo.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
    const len = Math.sqrt(px*px + py*py + pz*pz) || 1;
    const vx = px / len, vy = py / len, vz = pz / len;
    const tx = vx, ty = vz, tz = vy;   /* three→taubin 轴映射 */
    let r;
    if (taubinF(1.65*tx, 1.65*ty, 1.65*tz) <= 0){ r = 1.65; }
    else {
      let lo = 0.25, hi = 1.65;
      for (let k = 0; k < 24; k++){
        const mid = (lo + hi) * 0.5;
        if (taubinF(mid*tx, mid*ty, mid*tz) > 0) hi = mid; else lo = mid;
      }
      r = (lo + hi) * 0.5;
    }
    pos.setXYZ(i, vx * r, vy * r, vz * r);
  }
  heartGeo.computeVertexNormals();
  heartGeo.computeBoundingBox();
  const bb = heartGeo.boundingBox;
  const sx = HW / (bb.max.x - bb.min.x), sy = HH / (bb.max.y - bb.min.y);
  heartGeo.applyMatrix4(new THREE.Matrix4().makeScale(sx, sy, sx));
  heartGeo.center();
}

/* ── 透明外壳（D1 裁决：opacity 方案，transmission 留开关）── */
const USE_TRANSMISSION = false;
const shellMat = new THREE.MeshPhysicalMaterial({
  color: 0xFFB7CD, roughness: 0.15, metalness: 0.05,
  clearcoat: 0.6, clearcoatRoughness: 0.3,
  transparent: true, opacity: 0, depthWrite: false,   /* opacity 运行时 = 0.42×g(t) */
  emissive: 0x8A1030, emissiveIntensity: 0.25
});
/* transmission 实验参数（r146 透射缓冲对加色透明队列不可靠，默认关闭）：
if (USE_TRANSMISSION) Object.assign(shellMat, {
  transparent: true, opacity: 1, depthWrite: false,
  transmission: 0.92, thickness: 1.8, ior: 1.32,
  attenuationColor: new THREE.Color(0xff4d7e), attenuationDistance: 4.5
});
*/
const heart = new THREE.Mesh(heartGeo, shellMat);
heart.renderOrder = 4;

/* ── 菲涅尔边缘光壳（外壳 1.03 倍克隆，BackSide + 加色；1.03 为构建期静态值）── */
const fresnelMat = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(0xff7fa6) }, uIntensity: { value: 0 } },
  vertexShader: `
    varying vec3 vNormal; varying vec3 vViewDir;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vViewDir = -mvPosition.xyz;
      gl_Position = projectionMatrix * mvPosition;
    }`,
  fragmentShader: `
    varying vec3 vNormal; varying vec3 vViewDir;
    uniform vec3 uColor; uniform float uIntensity;
    void main(){
      float f = pow(1.0 - abs(dot(normalize(vNormal), normalize(vViewDir))), 2.6);
      gl_FragColor = vec4(uColor * f * uIntensity, 1.0);
    }`,
  side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
});
const fresnel = new THREE.Mesh(heartGeo, fresnelMat);
fresnel.scale.setScalar(1.03);
fresnel.renderOrder = 5;

/* ── 内骨交叉心曲线管（renderOrder 3）：竖立心 + 绕 Y 90° 窄化版（x 压 0.6）──
       与底部投影曲线同源参数式；内芯 r0.35 #FFD3E0 + 外辉光 r×2.2 #FF4D7E
       （rotation/scale 为构建期静态变换，动画代码不触碰子层 transform） */
function heartParam(u){
  return {
    x: 16 * Math.pow(Math.sin(u), 3),
    y: 13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u)
  };
}
const HSX = HW * 0.62 / 32, HSY = HH * 0.62 / 22;   /* 内骨 = 外壳包络 0.62 同心 */
const bonePts = [];
for (let i = 0; i < 120; i++){
  const q = heartParam(i / 120 * Math.PI * 2);
  bonePts.push(new THREE.Vector3(q.x * HSX, q.y * HSY, 0));
}
const boneCurve = new THREE.CatmullRomCurve3(bonePts, true);
const boneCoreGeo = new THREE.TubeGeometry(boneCurve, 160, 0.35, 8, true);
const boneGlowGeo = new THREE.TubeGeometry(boneCurve, 160, 0.35 * 2.2, 8, true);
const BONE_CORE_BASE = new THREE.Color(0xFFD3E0);
const boneCoreMat = new THREE.MeshBasicMaterial({ color: 0xFFD3E0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const boneGlowMat = new THREE.MeshBasicMaterial({ color: 0xFF4D7E, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
const boneA  = new THREE.Mesh(boneCoreGeo, boneCoreMat);
const boneAG = new THREE.Mesh(boneGlowGeo, boneGlowMat);
const boneB  = new THREE.Mesh(boneCoreGeo, boneCoreMat); boneB.rotation.y = Math.PI / 2; boneB.scale.set(0.6, 1, 1);
const boneBG = new THREE.Mesh(boneGlowGeo, boneGlowMat); boneBG.rotation.y = Math.PI / 2; boneBG.scale.set(0.6, 1, 1);
[boneA, boneAG, boneB, boneBG].forEach(m => { m.renderOrder = 3; });

/* ── 背衬光晕：与外壳/菲涅尔/内骨同挂 heartGroup（v1.1 条款2 结构防呆）── */
const haloCv = document.createElement('canvas'); haloCv.width = 256; haloCv.height = 256;
{
  const c = haloCv.getContext('2d');
  const g = c.createRadialGradient(128, 128, 10, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,77,126,0.25)'); g.addColorStop(1, 'rgba(255,77,126,0)');
  c.fillStyle = g; c.fillRect(0, 0, 256, 256);
}
const haloMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(haloCv), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0 });
const halo = new THREE.Sprite(haloMat);
halo.scale.set(37.5, 39.5, 1);   /* 心后方 ≈1.5×心宽（随 Group 缩放入场） */
halo.position.set(0, 0.5, -16);  /* Group 局部坐标：心中心正后方 */
halo.renderOrder = 0;

/* ── 心体 Group：四层唯一根节点，动画仅写此节点的 scale/position ── */
const heartGroup = new THREE.Group();
heartGroup.add(halo, boneA, boneAG, boneB, boneBG, heart, fresnel);
heartGroup.position.set(HX, 0, 0);
heartGroup.visible = false;
scene.add(heartGroup);

/* ── 底部投影曲线（锚）：躺平台面 y=-22，双层管 + 描线 setDrawRange ── */
const floorRoot = new THREE.Group();
floorRoot.position.set(DX, FY, FZ);
scene.add(floorRoot);
const floorPts = [];
for (let i = 0; i < 120; i++){
  const q = heartParam(i / 120 * Math.PI * 2);
  floorPts.push(new THREE.Vector3(q.x * FS, 0, q.y * FS * ZS));
}
const floorCurve = new THREE.CatmullRomCurve3(floorPts, true);
const floorCoreGeo = new THREE.TubeGeometry(floorCurve, 240, 0.28, 10, true);
const floorGlowGeo = new THREE.TubeGeometry(floorCurve, 240, 0.28 * 2.2, 10, true);
const FLOOR_TRIS = floorCoreGeo.index.count / 3;   /* indexed：三角级 setDrawRange（D5） */
const floorCoreMat = new THREE.MeshBasicMaterial({ color: 0xFFD3E0, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const floorGlowMat = new THREE.MeshBasicMaterial({ color: 0xFF4D7E, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
const floorCore = new THREE.Mesh(floorCoreGeo, floorCoreMat);
const floorGlow = new THREE.Mesh(floorGlowGeo, floorGlowMat);
floorCore.renderOrder = 3; floorGlow.renderOrder = 3;
floorCoreGeo.setDrawRange(0, 0);
floorGlowGeo.setDrawRange(0, 0);
const curveGrp = new THREE.Group();      /* 仅曲线管参与 pulse 微呼吸 1.0→1.03 */
curveGrp.add(floorCore, floorGlow);
floorRoot.add(curveGrp);

/* ── 地面辉光盘（v1.1 条款4）：stops 0.50→40%@0.22→70%@0.08→100% 全透明，
       直径 0.40W=768px（盘心深度 R=20.9wu），长尾缓坡无硬边 ── */
const discCv = document.createElement('canvas'); discCv.width = 256; discCv.height = 256;
{
  const c = discCv.getContext('2d');
  const g = c.createRadialGradient(128, 128, 4, 128, 128, 128);
  g.addColorStop(0, 'rgba(255,77,126,0.50)');
  g.addColorStop(0.40, 'rgba(255,77,126,0.22)');
  g.addColorStop(0.70, 'rgba(255,77,126,0.08)');
  g.addColorStop(1, 'rgba(255,77,126,0)');
  c.fillStyle = g; c.fillRect(0, 0, 256, 256);
}
const discMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(discCv), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const disc = new THREE.Mesh(new THREE.PlaneGeometry(DISC_R * 2, DISC_R * 2), discMat);
disc.rotation.x = -Math.PI / 2;
disc.scale.set(1, 0.55, 1);          /* 局部 Y 压扁 → 世界 z 纵深压扁 ≈120px 屏高 */
disc.position.set(0, 0.02, DISC_Z - FZ);
disc.renderOrder = 3;
floorRoot.add(disc);

/* ── 锥形光束：心底尖 → 盘心，加色渐变（顶 2.4wu / 底 7.5wu）── */
const beamCv = document.createElement('canvas'); beamCv.width = 16; beamCv.height = 128;
{
  const c = beamCv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, 128);
  g.addColorStop(0, 'rgba(255,127,166,0.10)');
  g.addColorStop(0.55, 'rgba(255,127,166,0.28)');
  g.addColorStop(1, 'rgba(255,127,166,0.60)');
  c.fillStyle = g; c.fillRect(0, 0, 16, 128);
}
const beamMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(beamCv), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const beamTop = new THREE.Vector3(HX, APEX_Y1, 0);
const beamBot = new THREE.Vector3(DX, FY, DISC_Z);
const beam = new THREE.Mesh(
  new THREE.CylinderGeometry(2.4, 7.5, beamTop.distanceTo(beamBot), 28, 1, true),
  beamMat
);
beam.position.copy(beamTop).add(beamBot).multiplyScalar(0.5);
beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(beamTop, beamBot).normalize());
beam.renderOrder = 2;
scene.add(beam);

/* ── 描线光点（起笔 spark）：小球 + 加色 sprite，沿曲线参数位移动 ── */
const sparkCv = document.createElement('canvas'); sparkCv.width = 32; sparkCv.height = 32;
{
  const c = sparkCv.getContext('2d');
  const g = c.createRadialGradient(16, 16, 1, 16, 16, 15);
  g.addColorStop(0, 'rgba(255,211,224,1)'); g.addColorStop(0.4, 'rgba(255,127,166,0.6)'); g.addColorStop(1, 'rgba(255,127,166,0)');
  c.fillStyle = g; c.fillRect(0, 0, 32, 32);
}
const sparkGrp = new THREE.Group();
const sparkCoreMat = new THREE.MeshBasicMaterial({ color: 0xFFD3E0, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
const sparkCore = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), sparkCoreMat);
sparkCore.renderOrder = 3;
const sparkGlowMat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(sparkCv), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0 });
const sparkGlow = new THREE.Sprite(sparkGlowMat);
sparkGlow.scale.set(4.2, 4.2, 1);
sparkGlow.renderOrder = 3;
sparkGrp.add(sparkCore, sparkGlow);
sparkGrp.visible = false;
floorRoot.add(sparkGrp);
const sparkLight = new THREE.PointLight(0xff5c86, 0, 30);
scene.add(sparkLight);
const tipPos = new THREE.Vector3();

/* ── 粒子（700，球壳玫瑰尘埃，加色，纯函数位置 + 心体正后方 ×0.6 压暗）── */
const DUST_N = 700;
const dustPos = new Float32Array(DUST_N * 3);
const dustCol = new Float32Array(DUST_N * 3);
const dustRand = mulberry32(20261106);
const DUST_SEED = Array.from({ length: DUST_N }, () => [dustRand(), dustRand(), dustRand(), dustRand()]);
const dustTexCv = document.createElement('canvas'); dustTexCv.width = 32; dustTexCv.height = 32;
{
  const c = dustTexCv.getContext('2d');
  const g = c.createRadialGradient(16, 16, 1, 16, 16, 15);
  g.addColorStop(0, 'rgba(255,220,230,1)'); g.addColorStop(0.4, 'rgba(255,150,180,0.6)'); g.addColorStop(1, 'rgba(255,150,180,0)');
  c.fillStyle = g; c.fillRect(0, 0, 32, 32);
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
const dustMat = new THREE.PointsMaterial({
  map: new THREE.CanvasTexture(dustTexCv), size: 1.15, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, color: 0xff6b93,
  opacity: 0.72, vertexColors: true
});
const dust = new THREE.Points(dustGeo, dustMat);
dust.renderOrder = 1;
scene.add(dust);

function updateDust(t){
  for (let i = 0; i < DUST_N; i++){
    const a = DUST_SEED[i][0], b = DUST_SEED[i][1], c = DUST_SEED[i][2], d = DUST_SEED[i][3];
    const th = a * Math.PI * 2 + t * 0.05;         /* 自转烘焙进纯函数（不用对象旋转，保证压暗判定一致） */
    const ph = Math.acos(2 * b - 1);
    const R = 16 + c * 30;
    const drift = Math.sin(t * 0.4 + d * 6.28) * 2.2;
    const rise = ((t * 0.55 + d * 40) % 30) - 15;
    const x = Math.sin(ph) * Math.cos(th) * R + drift + HX;
    const y = Math.cos(ph) * R * 0.72 + rise * 0.35;
    const z = Math.sin(ph) * Math.sin(th) * R;
    dustPos[i*3] = x; dustPos[i*3+1] = y; dustPos[i*3+2] = z;
    const dim = (z < -7 && x > HX - 11 && x < HX + 11 && y > HY - 12 && y < HY + 12) ? 0.6 : 1;
    dustCol[i*3] = dim; dustCol[i*3+1] = dim; dustCol[i*3+2] = dim;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.color.needsUpdate = true;
}

/* ── 3D 层渲染（纯时间函数）── */
function renderGL(t){
  const g = entrance(t);          /* 入场因子 0→1（1.6–2.6s） */
  const p = pulse(t);

  /* 心体：三通道同步 easeOutCubic——底尖锚定浮起 / scale 0.6→1 / opacity×g
     （位置与 scale 均为 easeOutCubic，无 overshoot；Group 根节点是唯一动画入口） */
  const s = 0.6 + 0.4 * g;
  const apexY = APEX_Y0 + (APEX_Y1 - APEX_Y0) * g;
  heartGroup.visible = g > 0.001;
  heartGroup.scale.setScalar(s);
  /* 主理人验收补遗：摆动 + 悬浮（旧版核心元素，规范未继承）——
     不旋转则「各视角都是爱心」无从展示；仍只写 Group 根，符合 R2 防呆 */
  heartGroup.rotation.y = -0.15 + Math.sin(t * 0.85) * 0.5;   /* 连续摆动 ±28.6° */
  heartGroup.rotation.x = -0.05 + Math.sin(t * 0.5) * 0.04;
  heartGroup.position.set(HX, apexY + (HH / 2) * s + Math.sin(t * 0.9) * 0.5, 0);

  /* 入场因子 g 统一乘入四层基础 opacity/发光（v1.1 条款1） */
  shellMat.opacity = 0.42 * g;
  haloMat.opacity = g;
  const boneK = (0.6 + 0.8 * p) * g;

  /* pulse 七处同步（同相同幅映射） */
  shellMat.emissiveIntensity = 0.25 + 0.60 * p;                                /* 1 外壳 emissive 0.25→0.85 */
  fresnelMat.uniforms.uIntensity.value = (0.55 + 0.55 * p) * g;                /* 2 菲涅尔 0.55→1.10 */
  boneCoreMat.color.copy(BONE_CORE_BASE).multiplyScalar(boneK);                /* 3 内骨亮度 0.6→1.4 */
  boneGlowMat.opacity = 0.35 * (0.7 + 0.3 * p) * g;
  bottomLight.intensity = 1.6 + 1.0 * p;                                       /* 4 底部点光 1.6→2.6 */
  /* R4：辉光管 1.35–1.6s 拉升，t=1.6 帧 glowK=0.97 → opacity≈0.34 ≥ 0.35×0.9；
     盘 opacity 渐起（1.0–1.5s seg）不受此拉升影响 */
  const pk = 0.7 + 0.3 * p;                                                    /* 5 曲线辉光/盘 同相 */
  floorGlowMat.opacity = 0.35 * Math.max(pk, 0.7 + 0.27 * seg(t, 1.35, 1.6));
  discMat.opacity = 0.35 * seg(t, 1.0, 1.5) * pk;
  beamMat.opacity = 0.12 * seg(t, 1.6, 2.1) * (0.5 + 0.5 * Math.min(1, p));    /* 6 光束 0.06→0.12，1.6s 点亮 */

  /* R3 底部曲线描线：easeOutCubic(seg(t, 0.32, 1.7))
     → t=1.6: prog=1−0.2³=99.2%（≥99%，视觉闭合），1.7 完成 */
  const prog = easeOutCubic(seg(t, 0.32, 1.7));
  const idxCount = 3 * Math.floor(prog * FLOOR_TRIS);
  floorCoreGeo.setDrawRange(0, idxCount);
  floorGlowGeo.setDrawRange(0, idxCount);
  curveGrp.scale.setScalar(1 + 0.03 * p);   /* 曲线整体 1.0→1.03 同相微呼吸 */

  /* 描线光点：0–0.32 起笔淡入于曲线起点上方，随描线前沿移动，1.7–1.95 消隐 */
  const tipA = seg(t, 0.03, 0.32) * (1 - seg(t, 1.7, 1.95));
  sparkGrp.visible = tipA > 0.001;
  if (sparkGrp.visible){
    floorCurve.getPointAt(prog, tipPos);
    sparkGrp.position.set(tipPos.x, tipPos.y + 0.6, tipPos.z);
    sparkCoreMat.opacity = tipA;
    sparkGlowMat.opacity = 0.85 * tipA;
    sparkLight.position.set(DX + tipPos.x, FY + tipPos.y + 0.6, FZ + tipPos.z);
  }
  sparkLight.intensity = 2.4 * tipA;

  /* 粒子呼吸调制（2.5–3.0 启动） */
  updateDust(t);
  dustMat.opacity = 0.72 * (1 + 0.45 * p * seg(t, 2.5, 3.0));                  /* 7 粒子亮度 */

  /* 灯光呼吸 / 阴影 */
  rimLight.intensity = 1.15 + 0.2 * Math.sin(t * 1.1);
  shadowMat.opacity = 0.35 * g;

  /* 相机微漂移（纯 t） */
  camera.position.x = Math.sin(t * 0.4) * 1.1;
  camera.position.y = 1.2 + Math.cos(t * 0.33) * 0.6;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

/* ═══ 2D overlay 层（绘制顺序：grain → vignette → L3 标注 → 字幕 → 顶栏）═══ */
const cv2 = document.getElementById('ui');
cv2.width = W; cv2.height = H;
const ctx2 = cv2.getContext('2d');

const GRAIN = (() => { const r = mulberry32(20261106); return Array.from({length: 900}, () => [r()*W, r()*H, r()*0.028+0.012]); })();
function drawOverlayGrain(){
  for (const [x, y, a] of GRAIN){ ctx2.fillStyle = `rgba(255,255,255,${a})`; ctx2.fillRect(x, y, 1.5, 1.5); }
}
function vignette(){
  const v = ctx2.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, H*0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.62)');
  ctx2.fillStyle = v; ctx2.fillRect(0, 0, W, H);
}

/* 标注层：心顶标注 + 公式框（中心 1546,130 / 框 510×80 / 常驻） */
function drawL3(t){
  drawText('THREE.JS · PBR 真渲染', CX - 175, CY - 335, { font: '21px "Microsoft YaHei"', color: GRAY, align: 'right', alpha: seg(t, 1.5, 2.3), track: 6 });
  const fa = seg(t, 3.15, 4.05);
  if (fa > 0){
    ctx2.save();
    ctx2.globalAlpha = fa;
    const bx = 1291, by = 90, bw = 510, bh = 80;
    ctx2.fillStyle = 'rgba(20,4,12,0.55)';
    ctx2.fillRect(bx, by, bw, bh);
    ctx2.strokeStyle = 'rgba(255,143,179,0.4)';
    ctx2.lineWidth = 1;
    ctx2.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    ctx2.font = '40px Consolas, monospace';
    ctx2.textBaseline = 'alphabetic';
    ctx2.fillStyle = '#FFD3E0';
    const eq = '(x²+y²−1)³ − x²y³ = 0';
    ctx2.fillText(eq, 1546 - ctx2.measureText(eq).width / 2, 144);
    ctx2.restore();
    drawText('真实透视 · 真实光照', 1546, 206, { font: '22px "Microsoft YaHei"', color: `rgba(160,136,152,${fa})`, align: 'center' });
  }
}

/* 字幕带：中文基线 956 / 英文基线 1018；shadowBlur 18 + 1px 描边 #40060F */
function drawSubtitle(t){
  const a1 = Math.min(seg(t, 0.90, 1.30), 1 - seg(t, 4.05, 4.45));
  if (a1 > 0){
    ctx2.save();
    ctx2.shadowColor = 'rgba(64,6,15,0.9)'; ctx2.shadowBlur = 18; ctx2.shadowOffsetY = 3;
    drawText('数学家是怎么画爱心的？', W / 2, 956, { font: '700 46px "Microsoft YaHei"', color: '#FFF0F5', alpha: a1, stroke: '#40060F', strokeW: 1 });
    drawText('How does a mathematician draw a heart?', W / 2, 1018, { font: 'italic 30px Georgia', color: '#FF8FB3', alpha: a1 * 0.92, stroke: '#40060F', strokeW: 1 });
    ctx2.restore();
  }
  const a2 = seg(t, 6.50, 6.90);
  if (a2 > 0){
    const bump = Math.sin(Math.PI * seg(t, 7.7, 7.95));   /* 7.7s 收尾强跳对齐脉冲 1.03× 0.25s */
    const scale = 1 + 0.03 * bump;
    ctx2.save();
    ctx2.translate(W / 2, 956);
    ctx2.scale(scale, scale);
    ctx2.shadowColor = 'rgba(64,6,15,0.9)'; ctx2.shadowBlur = 18; ctx2.shadowOffsetY = 3;
    drawText('一条曲线，就够了。', 0, 0, { font: '700 46px "Microsoft YaHei"', color: '#FFF0F5', alpha: a2, stroke: '#40060F', strokeW: 1 });
    drawText('One curve is all it takes.', 0, 62, { font: 'italic 30px Georgia', color: '#FF8FB3', alpha: a2 * 0.92, stroke: '#40060F', strokeW: 1 });
    ctx2.restore();
  }
}

/* 顶栏（弱化无发光） */
function drawTopbar(t){
  drawText('@VIBE·DSF', 64, 68, { font: '21px "Microsoft YaHei"', color: 'rgba(160,136,152,0.85)', align: 'left', track: 4 });
  drawText('心形曲线 · THREE.JS', W / 2, 68, { font: '21px "Microsoft YaHei"', color: 'rgba(255,92,134,0.9)', track: 8 });
  const mm = String(Math.floor(t / 60)).padStart(2, '0');
  const ss = String(Math.floor(t % 60)).padStart(2, '0');
  const ff = String(Math.floor((t % 1) * 30)).padStart(2, '0');
  drawText(`${mm}:${ss}:${ff}`, W - 64, 68, { font: '21px Consolas, monospace', color: 'rgba(160,136,152,0.7)', align: 'right' });
}

/* ═══ 合成契约 ═══ */
window.render = function(t){
  renderGL(t);
  ctx2.clearRect(0, 0, W, H);
  drawOverlayGrain();
  vignette();
  drawL3(t);
  drawSubtitle(t);
  drawTopbar(t);
};

/* 抓帧模式 / 预览 */
window.DUR = DUR;
window.READY = false;
if (new URLSearchParams(location.search).has('t')){
  const t = parseFloat(new URLSearchParams(location.search).get('t'));
  document.fonts.ready.then(() => { window.render(t); window.READY = true; });
} else {
  document.fonts.ready.then(() => {
    window.READY = true;
    const t0 = performance.now();
    (function loop(now){ window.render(((now || performance.now()) - t0) / 1000 % DUR); requestAnimationFrame(loop); })();
  });
}
</script>
