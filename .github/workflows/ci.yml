name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r pipeline/requirements.txt

      # Single source of truth: the same command developers run locally.
      # All MVP checks (version sync, core files, syntax, plan gate,
      # assemble smoke, two regression fixtures, site self-check) live there.
      - name: MVP acceptance (scripts/verify.py)
        run: python scripts/verify.py

      # 渲染/QA/合成需要 Chrome + ffmpeg + 音频轨，在本地跑：
      #   powershell -File pipeline/run_all.ps1 -Project projects/<slug> -Duration <秒>
      # （见 CONTRIBUTING.md「验证流程」）
